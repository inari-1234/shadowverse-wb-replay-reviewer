<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>更新ループ復旧</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#0a1020;color:#f7f8fb;padding:24px;line-height:1.6}.box{max-width:640px;margin:auto;background:#111a2c;border:1px solid #26334b;border-radius:16px;padding:18px}small{color:#9ba8bf}</style></head><body><div class="box"><h1>更新ループを復旧しています</h1><p id="s">最新版情報を取得中…</p><small>このページは古いService WorkerとWBキャッシュを整理し、クエリなしの正規Service Workerを再登録します。</small></div><script>
(async()=>{const s=document.getElementById('s'),delay=ms=>new Promise(r=>setTimeout(r,ms));const queryWorker=(w,timeout=900)=>new Promise(resolve=>{if(!w){resolve(null);return}const ch=new MessageChannel(),to=setTimeout(()=>resolve(null),timeout);ch.port1.onmessage=e=>{clearTimeout(to);resolve(e.data||null)};try{w.postMessage({type:'wb-version-query'},[ch.port2])}catch{clearTimeout(to);resolve(null)}});try{const mu=new URL('./latest.json',location.href);mu.searchParams.set('_',Date.now());const mr=await fetch(mu.href,{cache:'no-store'});if(!mr.ok)throw new Error('latest.json '+mr.status);const m=await mr.json();s.textContent=`${m.version} の復旧準備中…`;if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>String(r.scope||'').includes('/shadowverse-wb-replay-reviewer/')).map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('wb-review-')).map(k=>caches.delete(k)))}await delay(180);if(!('serviceWorker'in navigator))throw new Error('Service Worker非対応');const sw=new URL(m.sw,location.href);sw.search='';sw.hash='';const reg=await navigator.serviceWorker.register(sw.href,{updateViaCache:'none'});await reg.update();const until=Date.now()+15000;let ready=false;while(Date.now()<until){const ks='caches'in window?await caches.keys():[],active=reg.active;if(active?.state==='activated'&&ks.includes(m.cache)){const q=await queryWorker(active);if(q?.build===m.build&&q?.cache===m.cache){ready=true;break}}await delay(120)}if(!ready)throw new Error('最新版Service Workerの有効化を確認できませんでした');s.textContent=`復旧完了。${m.version} を開きます…`;await delay(250);location.replace(new URL('./',location.href).href)}catch(e){s.textContent='自動復旧に失敗しました: '+(e?.message||e)}})();
</script></body></html>
