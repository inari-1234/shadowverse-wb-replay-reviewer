<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<title>シャドバWB リプレイ診断</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0a1020;color:#f7f8fb}header{position:sticky;top:0;z-index:10;background:#101827;padding:12px 16px;border-bottom:1px solid #26334b}header h1{font-size:18px;margin:0 0 3px}header p{margin:0;color:#9ba8bf;font-size:12px}main{max-width:820px;margin:auto;padding:14px}.panel{background:#111a2c;border:1px solid #26334b;border-radius:16px;padding:14px;margin-bottom:12px}h2{font-size:16px;margin:0 0 12px}.help{color:#9aa8bf;font-size:13px;line-height:1.55}video{width:100%;max-height:52vh;background:#000;border-radius:10px;margin-top:10px}input,select,textarea,button{font:inherit}input[type=file]{width:100%}input[type=text],input[type=number],select,textarea{width:100%;padding:10px;border-radius:9px;background:#0b1323;color:white;border:1px solid #35435f}textarea{min-height:78px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.timebar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-top:8px;font-variant-numeric:tabular-nums}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{border:0;border-radius:10px;padding:10px 12px;background:#334155;color:#fff;font-weight:650}button.primary{background:#2563eb}.good{background:#0f766e}.danger{background:#991b1b}button:disabled{opacity:.4}.progress{height:8px;background:#263247;border-radius:99px;overflow:hidden;margin-top:12px}.progress>div{height:100%;width:0;background:#4f8cff}.hidden{display:none}.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.candidate{position:relative;border:1px solid #33415a;border-radius:10px;overflow:hidden;background:#0b1220}.candidate img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}.candidate button{position:absolute;right:5px;bottom:5px;padding:6px 8px;font-size:12px;background:rgba(0,0,0,.75)}.candidate .stamp{position:absolute;left:5px;top:5px;background:rgba(0,0,0,.72);padding:3px 6px;border-radius:7px;font-size:11px}.savedItem{display:grid;grid-template-columns:100px 1fr;gap:10px;padding:10px 0;border-top:1px solid #26334b}.savedItem img{width:100px;height:75px;object-fit:cover;border-radius:8px}.muted{color:#9ba8bf;font-size:12px}.badge{display:inline-block;background:#26344a;border-radius:999px;padding:3px 7px;font-size:11px;margin-right:4px}.roiGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}.roiCard{background:#0b1323;border:1px solid #2c3952;border-radius:10px;padding:8px}.roiCard img{width:100%;height:70px;object-fit:cover;border-radius:7px;background:#000}.roiCard b{display:block;font-size:12px;margin-bottom:5px}@media(max-width:560px){.grid{grid-template-columns:1fr}.thumbs{grid-template-columns:repeat(2,1fr)}.savedItem{grid-template-columns:82px 1fr}.savedItem img{width:82px;height:62px}.roiGrid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><h1>シャドバWB リプレイ診断</h1><p>録画は端末内で処理。動画本体は送信しません。</p></header>
<main>
<section class="panel"><h2>1. リプレイ録画</h2><input id="videoFile" type="file" accept="video/*"><video id="video" controls playsinline preload="metadata"></video><div class="timebar"><span id="now">00:00.0</span><input id="scrub" type="range" min="0" max="1" step="0.1" value="0"><span id="dur">00:00.0</span></div><div class="buttons"><button data-jump="-5">−5秒</button><button data-jump="-1">−1秒</button><button data-jump="1">＋1秒</button><button data-jump="5">＋5秒</button></div></section>
<section class="panel"><h2>2. 局面候補の自動抽出</h2><p class="help">動画を一定間隔で比較し、画面変化が大きかった地点を候補として拾います。</p><div class="grid"><label>走査間隔<select id="interval"><option value="1">1秒</option><option value="2" selected>2秒（推奨）</option><option value="3">3秒</option></select></label><label>感度<select id="sensitivity"><option value="0.070">高い</option><option value="0.105" selected>標準</option><option value="0.145">低い</option></select></label></div><div class="buttons"><button id="scan" class="primary" disabled>自動抽出を開始</button><button id="cancelScan" disabled>中止</button></div><div id="progressWrap" class="progress hidden"><div id="progress"></div></div><p id="scanStatus" class="help"></p><div id="candidates" class="thumbs"></div></section>
<section class="panel"><h2>3. この局面を保存</h2><div class="grid"><label>ターン<input id="turn" type="number" min="1" max="30" value="1"></label><label>先後<select id="playOrder"><option>先攻</option><option>後攻</option></select></label><label>対面<input id="matchup" type="text" placeholder="例：ウィッチ"></label><label>デッキ<input id="deck" type="text" value="海賊ロイヤル"></label></div><label>質問 / メモ<textarea id="note" placeholder="例：2TでエクストラPPを切って砲手。1T待つ方がよかった？"></textarea></label><button id="capture" class="primary" disabled>現在の局面を保存</button><p class="help">保存時に、OCR予定領域（相手情報・中央情報・自分情報）も自動で切り出します。</p><div id="roiPreview" class="roiGrid"></div></section>
<section class="panel"><h2>4. 保存済み局面 <span id="count">0</span></h2><button id="clear" class="danger">全削除</button><div id="saved"></div></section>
<section class="panel"><h2>5. ChatGPT用に出力</h2><p class="help">review.jsonを書き出します。録画本体は含みません。</p><button id="exportJson" class="good" disabled>review.jsonを書き出す</button><p id="status" class="help"></p></section>
</main>
<script>
const $=s=>document.querySelector(s),video=$("#video"),scrub=$("#scrub");let videoName="replay",cancelled=false,scenes=[],candidates=[];
const ROI={opponent:{x:.05,y:.02,w:.90,h:.20,label:'相手情報'},center:{x:.18,y:.36,w:.64,h:.28,label:'中央・ターン/PP候補'},player:{x:.05,y:.76,w:.90,h:.22,label:'自分情報'}};
function fmt(sec){if(!isFinite(sec))return"00:00.0";const m=Math.floor(sec/60),s=(sec-m*60).toFixed(1).padStart(4,"0");return String(m).padStart(2,"0")+":"+s}function safe(s){return(s||"replay").replace(/\.[^.]+$/,'').replace(/[^\w\u3040-\u30ff\u3400-\u9fff-]+/g,'_').slice(0,60)}function seek(t){return new Promise((res,rej)=>{const done=()=>res();video.addEventListener('seeked',done,{once:true});video.currentTime=Math.max(0,Math.min(video.duration-.05,t));setTimeout(()=>rej(new Error('シーク失敗')),5000)})}
$("#videoFile").addEventListener("change",e=>{const f=e.target.files?.[0];if(!f)return;videoName=safe(f.name);video.src=URL.createObjectURL(f);$("#capture").disabled=false;$("#scan").disabled=false});video.addEventListener("loadedmetadata",()=>{scrub.max=video.duration;$("#dur").textContent=fmt(video.duration)});video.addEventListener("timeupdate",()=>{$("#now").textContent=fmt(video.currentTime);scrub.value=video.currentTime});scrub.addEventListener("input",()=>video.currentTime=Number(scrub.value));document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>video.currentTime=Math.max(0,Math.min(video.duration||0,video.currentTime+Number(b.dataset.jump))));
function frameCanvas(maxW=1100){const scale=Math.min(1,maxW/video.videoWidth),c=document.createElement('canvas');c.width=Math.round(video.videoWidth*scale);c.height=Math.round(video.videoHeight*scale);c.getContext('2d').drawImage(video,0,0,c.width,c.height);return c}function canvasBlob(c,q=.72){return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('画像化失敗')),'image/jpeg',q))}async function frameBlob(maxW=1100,q=.72){return canvasBlob(frameCanvas(maxW),q)}async function cropBlob(baseCanvas,r,q=.78){const c=document.createElement('canvas');const sx=Math.round(baseCanvas.width*r.x),sy=Math.round(baseCanvas.height*r.y),sw=Math.round(baseCanvas.width*r.w),sh=Math.round(baseCanvas.height*r.h);c.width=sw;c.height=sh;c.getContext('2d').drawImage(baseCanvas,sx,sy,sw,sh,0,0,sw,sh);return canvasBlob(c,q)}
function sampleVector(){const w=160,h=90,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(video,0,0,w,h);const d=x.getImageData(0,0,w,h).data,out=new Uint8Array(w*h);for(let i=0,j=0;i<d.length;i+=4,j++)out[j]=(d[i]*3+d[i+1]*6+d[i+2])/10;return out}function diff(a,b){if(!a||!b)return 0;let sum=0;for(let i=0;i<a.length;i++)sum+=Math.abs(a[i]-b[i]);return sum/a.length/255}
$("#cancelScan").onclick=()=>cancelled=true;$("#scan").onclick=async()=>{cancelled=false;candidates=[];$("#candidates").innerHTML='';$("#scan").disabled=true;$("#cancelScan").disabled=false;$("#progressWrap").classList.remove('hidden');const interval=Number($("#interval").value),threshold=Number($("#sensitivity").value),dur=video.duration;let prev=null,last=-999,measured=[];try{for(let t=.1;t<dur;t+=interval){if(cancelled)break;await seek(t);const v=sampleVector(),score=prev?diff(prev,v):0;measured.push({t,score});prev=v;$("#progress").style.width=Math.min(100,t/dur*100)+'%';$("#scanStatus").textContent=`走査中 ${fmt(t)} / ${fmt(dur)}`;await new Promise(r=>setTimeout(r,0))}for(let i=1;i<measured.length-1;i++){const m=measured[i];if(m.score>=threshold&&m.score>=measured[i-1].score&&m.score>=measured[i+1].score&&m.t-last>=4){await seek(m.t);const blob=await frameBlob(640,.58);candidates.push({t:m.t,score:m.score,blob,url:URL.createObjectURL(blob)});last=m.t;if(candidates.length>=30)break}}renderCandidates();$("#scanStatus").textContent=`完了。候補 ${candidates.length}件`;}catch(e){$("#scanStatus").textContent='エラー: '+e.message}finally{$("#scan").disabled=false;$("#cancelScan").disabled=true}};
function renderCandidates(){const box=$("#candidates");box.innerHTML='';candidates.forEach((c,i)=>{const d=document.createElement('div');d.className='candidate';d.innerHTML=`<img src="${c.url}"><span class="stamp">${fmt(c.t)}</span><button data-go="${i}">ここを見る</button>`;box.appendChild(d)});box.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>video.currentTime=candidates[Number(b.dataset.go)].t)}
$("#capture").onclick=async()=>{try{const base=frameCanvas();const blob=await canvasBlob(base,.72);const crops={};for(const [k,r] of Object.entries(ROI)){const b=await cropBlob(base,r);crops[k]={blob:b,url:URL.createObjectURL(b)}}const scene={turn:Number($("#turn").value)||1,time:video.currentTime,playOrder:$("#playOrder").value,matchup:$("#matchup").value.trim(),deck:$("#deck").value.trim(),note:$("#note").value.trim(),blob,url:URL.createObjectURL(blob),crops};scenes.push(scene);renderROI(scene);$("#note").value='';renderSaved()}catch(e){$("#status").textContent='保存エラー: '+e.message}};
function renderROI(s){const box=$("#roiPreview");box.innerHTML='';for(const [k,r] of Object.entries(ROI)){const d=document.createElement('div');d.className='roiCard';d.innerHTML=`<b>${r.label}</b><img src="${s.crops[k].url}"><span class="muted">OCR対象候補</span>`;box.appendChild(d)}}
function renderSaved(){$("#count").textContent=scenes.length;$("#exportJson").disabled=!scenes.length;const box=$("#saved");box.innerHTML='';scenes.forEach((s,i)=>{const d=document.createElement('div');d.className='savedItem';d.innerHTML=`<img src="${s.url}"><div><span class="badge">${s.turn}T</span><span class="badge">${fmt(s.time)}</span><span class="badge">ROI 3種</span><div class="muted">${s.note||'メモなし'}</div></div>`;box.appendChild(d)})}
$("#clear").onclick=()=>{scenes=[];$("#roiPreview").innerHTML='';renderSaved()};
$("#exportJson").onclick=()=>{const data={format:'shadowverse-wb-review-v3-foundation',source:videoName,createdAt:new Date().toISOString(),roi:ROI,scenes:scenes.map((s,i)=>({no:i+1,turn:s.turn,timeSeconds:+s.time.toFixed(2),playOrder:s.playOrder,matchup:s.matchup||null,deck:s.deck||null,note:s.note||null,recognition:{turn:null,opponentHp:null,playerHp:null,opponentPp:null,playerPp:null,extraPp:null}}))};const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='review.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$("#status").textContent='review.jsonを書き出しました。'};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
