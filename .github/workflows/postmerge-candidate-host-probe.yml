name: Postmerge Candidate Host Probe

on:
  push:
    branches:
      - candidate/p-f1-r2-postmerge-host-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Probe merged candidate-live delivery hosts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,hashlib,base64,urllib.request,time,sys
          text=open('index.html',encoding='utf-8').read()
          m=re.search(r'window\.__wbRuntimeAssetManifest=(\{.*?\});',text,re.S)
          if not m: raise SystemExit('manifest not found')
          manifest=json.loads(m.group(1))
          expected_build='candidate-assets-3e98d8ce35df'
          if manifest.get('buildId')!=expected_build:
              raise SystemExit(f"unexpected local build {manifest.get('buildId')}")
          nonce=str(int(time.time()*1000))
          hosts={
            'rawgithack':'https://raw.githack.com/inari-1234/shadowverse-wb-replay-reviewer/candidate-live/{name}?_wb='+nonce,
            'rawgithub':'https://raw.githubusercontent.com/inari-1234/shadowverse-wb-replay-reviewer/candidate-live/{name}?_wb='+nonce,
            'jsdelivr':'https://cdn.jsdelivr.net/gh/inari-1234/shadowverse-wb-replay-reviewer@candidate-live/{name}?_wb='+nonce,
          }
          out={'buildId':manifest['buildId'],'candidateHead':'de8267d225e858276a21a14ed40b05f796cce429','hosts':{}}
          failed=False
          for host,tpl in hosts.items():
            rows=[]
            for name in manifest['assets']:
              expected=manifest['integrity'][name]
              url=tpl.format(name=name)
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
                with urllib.request.urlopen(req,timeout=25) as r:
                  data=r.read(); status=getattr(r,'status',200)
                actual='sha256-'+base64.b64encode(hashlib.sha256(data).digest()).decode()
                row={'name':name,'ok':actual==expected,'status':status,'expected':expected,'actual':actual,'bytes':len(data),'url':url}
              except Exception as e:
                row={'name':name,'ok':False,'error':repr(e),'url':url}
              rows.append(row)
            verified=sum(1 for r in rows if r.get('ok'))
            out['hosts'][host]={'verified':verified,'total':len(rows),'rows':rows}
            print(f'{host}: {verified}/{len(rows)}')
            if verified!=len(rows):
              failed=True
              for r in rows:
                if not r.get('ok'):
                  print(' FIRST_FAIL',json.dumps(r,ensure_ascii=False))
                  break
          open('/tmp/postmerge-candidate-host-probe.json','w').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print('SUMMARY',json.dumps({k:{'verified':v['verified'],'total':v['total']} for k,v in out['hosts'].items()}))
          if failed: sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postmerge-candidate-host-probe
          path: /tmp/postmerge-candidate-host-probe.json
          if-no-files-found: warn
