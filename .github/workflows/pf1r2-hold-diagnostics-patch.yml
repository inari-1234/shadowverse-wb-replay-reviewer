name: P-F1-R2 Hold Diagnostics Patch

on:
  push:
    branches:
      - candidate/p-f1-r2-hold-diagnostics
    paths:
      - '.github/workflows/pf1r2-hold-diagnostics-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: candidate/p-f1-r2-hold-diagnostics
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply hold diagnostics corrective
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, hashlib, base64

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'missing replacement anchor in {path}: {old[:100]!r}')
              s=s.replace(old,new,1)
              p.write_text(s)

          # P-F1: classify every HOLD before presentation/diagnostics.
          p='runtime-decision-pipeline.js'
          replace_once(p,"const VERSION='pf1-runtime-decision-pipeline-v1.2.1',EVENT='comparison-decision-ready';","const VERSION='pf1-runtime-decision-pipeline-v1.2.2',EVENT='comparison-decision-ready';")
          replace_once(p,
            "const HOLD=Object.freeze({AUTHORITY_MISSING:'AUTHORITY_MISSING',POSITION_STATE_UNAVAILABLE:'POSITION_STATE_UNAVAILABLE',DECISION_AUTHORITY_CAPTURE_MISSING:'DECISION_AUTHORITY_CAPTURE_MISSING',PREACTION_ANCHOR_AMBIGUOUS:'PREACTION_ANCHOR_AMBIGUOUS',NO_SEQUENCE_CANDIDATES:'NO_SEQUENCE_CANDIDATES',MODULE_UNAVAILABLE:'MODULE_UNAVAILABLE'});\nconst results=",
            "const HOLD=Object.freeze({AUTHORITY_MISSING:'AUTHORITY_MISSING',POSITION_STATE_UNAVAILABLE:'POSITION_STATE_UNAVAILABLE',DECISION_AUTHORITY_CAPTURE_MISSING:'DECISION_AUTHORITY_CAPTURE_MISSING',PREACTION_ANCHOR_AMBIGUOUS:'PREACTION_ANCHOR_AMBIGUOUS',NO_SEQUENCE_CANDIDATES:'NO_SEQUENCE_CANDIDATES',MODULE_UNAVAILABLE:'MODULE_UNAVAILABLE'});\nconst HOLD_KIND=Object.freeze({SEMANTIC_HOLD:'SEMANTIC_HOLD',AUTHORITY_HOLD:'AUTHORITY_HOLD',SYSTEM_ERROR:'SYSTEM_ERROR',UNKNOWN_HOLD:'UNKNOWN_HOLD'});\nconst results=")
          replace_once(p,
            "function getForWindow(windowId){const x=results.get(text(windowId));return x?clone(x):null}\nfunction emitHold(windowId,reason,detail={},meta={}){const row={version:VERSION,status:STATUS.HOLD,windowId:text(windowId),reason,detail:clone(detail),meta:clone(meta),at:new Date().toISOString()};if(row.windowId)results.set(row.windowId,row);expose();W.emit?.('runtime-decision-hold',clone(row));return clone(row)}",
            "function getForWindow(windowId){const x=results.get(text(windowId));return x?clone(x):null}\nfunction classifyHold(reason,detail={}){const codes=Array.isArray(detail?.reasonCodes)?detail.reasonCodes.filter(Boolean):[],generationStatus=text(detail?.generationStatus);if(reason===HOLD.NO_SEQUENCE_CANDIDATES&&generationStatus==='UNRESOLVED'&&codes.length)return HOLD_KIND.SEMANTIC_HOLD;if(reason===HOLD.DECISION_AUTHORITY_CAPTURE_MISSING||reason===HOLD.PREACTION_ANCHOR_AMBIGUOUS)return HOLD_KIND.AUTHORITY_HOLD;if(reason===HOLD.AUTHORITY_MISSING||reason===HOLD.POSITION_STATE_UNAVAILABLE||reason===HOLD.MODULE_UNAVAILABLE)return HOLD_KIND.SYSTEM_ERROR;if(reason===HOLD.NO_SEQUENCE_CANDIDATES)return HOLD_KIND.SYSTEM_ERROR;return HOLD_KIND.UNKNOWN_HOLD}\nfunction emitHold(windowId,reason,detail={},meta={}){const holdKind=classifyHold(reason,detail),row={version:VERSION,status:STATUS.HOLD,holdKind,windowId:text(windowId),reason,detail:clone(detail),meta:clone(meta),at:new Date().toISOString()};if(row.windowId)results.set(row.windowId,row);expose();W.emit?.('runtime-decision-hold',clone(row));return clone(row)}")
          replace_once(p,
            "const row={version:VERSION,status:STATUS.ERROR,windowId:id,reason:'PIPELINE_ERROR',detail:{message:err?.message||String(err)},meta:baseMeta,at:new Date().toISOString()};",
            "const row={version:VERSION,status:STATUS.ERROR,holdKind:HOLD_KIND.SYSTEM_ERROR,windowId:id,reason:'PIPELINE_ERROR',detail:{message:err?.message||String(err)},meta:baseMeta,at:new Date().toISOString()};")
          replace_once(p,
            "W.RuntimeDecisionPipeline=Object.freeze({version:VERSION,STATUS,HOLD,eventName:EVENT,registerAuthority,clearAuthority,authorityStatus,loadModules,loadPlayedMoveAuthority,loadAuthorityBinding,evaluateOutcomes,evaluateWindow,evaluateSession,getForWindow,snapshot,clear});",
            "W.RuntimeDecisionPipeline=Object.freeze({version:VERSION,STATUS,HOLD,HOLD_KIND,eventName:EVENT,classifyHold,registerAuthority,clearAuthority,authorityStatus,loadModules,loadPlayedMoveAuthority,loadAuthorityBinding,evaluateOutcomes,evaluateWindow,evaluateSession,getForWindow,snapshot,clear});")

          # P-E2: only semantic/authority HOLD becomes a comparison coach; system faults are diagnostic errors.
          p='coach-integration.js'
          replace_once(p,"const VERSION='pe2-coach-integration-v1.2.1',EVENT='comparison-decision-ready',PRESENTATION_VERSION='pf1r2-single-presentation-v1';","const VERSION='pe2-coach-integration-v1.2.2',EVENT='comparison-decision-ready',PRESENTATION_VERSION='pf1r2-single-presentation-v1';")
          replace_once(p,"const items=new Map();let authorityPromise=null,runtimePromise=null;","const items=new Map();const systemHoldKeys=new Set();let authorityPromise=null,runtimePromise=null;")
          replace_once(p,
            "function currentAnalysisRunId(){return W.ReplaySession?.snapshot?.()?.analysisRun?.runId||window.__wbReplaySessionV1?.analysisRun?.runId||null}\nasync function ingestDecision(detail={}){const d=normalizeDetail(detail),activeRunId=currentAnalysisRunId();if(!d.windowId||!d.decision||!d.runId||!activeRunId||String(d.runId)!==String(activeRunId)||!authorityPresentationForWindow(d.windowId,d.runId))return null;const authority=await loadAuthority(),explanation=authority.explainDecision(d.decision,{playedMove:d.playedMove}),row={version:VERSION,windowId:d.windowId,runId:d.runId,sourceAuthority:d.sourceAuthority,receivedAt:d.receivedAt,playedMove:clone(d.playedMove),decisionIdentity:{status:d.decision.status||null,classification:d.decision.classification||null,bestCandidateId:d.decision.bestCandidateId||null,meaningfulAlternativeCandidateId:d.decision.meaningfulAlternativeCandidateId||null},explanation:clone(explanation)};items.set(d.windowId,row);expose();scheduleDecorate();return clone(row)}\nfunction safeHoldDecision(row={}){const reasons=[...new Set(['INSUFFICIENT_AUTHORITY',...(Array.isArray(row?.detail?.reasonCodes)?row.detail.reasonCodes:[]),row?.reason].filter(Boolean))];return{status:'HOLD',classification:'INSUFFICIENT_EVIDENCE',bestCandidateId:null,meaningfulAlternativeCandidateId:null,reasonCodes:reasons,criticalDifference:null,ranking:{pairwise:[]},meta:{sourceStatus:row?.status||'HOLD',sourceReason:row?.reason||null,generationStatus:row?.detail?.generationStatus||null}}}\nasync function syncFromRuntime(runId=null){const snap=W.RuntimeDecisionPipeline?.snapshot?.()||window.__wbRuntimeDecisionPipelineV1||null,rows=Array.isArray(snap?.items)?snap.items:[];let ingested=0,skipped=0;for(const row of rows){const rowRunId=row?.meta?.runId||row?.runId||null,windowId=text(row?.windowId);if(!windowId||!rowRunId){skipped++;continue}if(runId&&String(rowRunId)!==String(runId)){skipped++;continue}if(!authorityPresentationForWindow(windowId,rowRunId)){skipped++;continue}const current=items.get(windowId);if(current&&String(current.runId||'')===String(rowRunId)){skipped++;continue}let decision=null,sourceAuthority=row.sourceAuthority||'P-F1/P-D1/P-F1-R2-PM',playedMove=row.playedMove||row?.meta?.playedMove||null;if(row?.status==='OK'&&row?.decision)decision=row.decision;else if(row?.status==='HOLD'){decision=safeHoldDecision(row);sourceAuthority='P-F1 SAFE_HOLD';playedMove=null}else{skipped++;continue}const accepted=await ingestDecision({windowId,decision,playedMove,sourceAuthority,receivedAt:row.at||new Date().toISOString(),runId:rowRunId});if(accepted)ingested++;else skipped++}return{version:PRESENTATION_VERSION,runId:runId||null,examined:rows.length,ingested,skipped}}\nfunction clear(){items.clear();expose();W.ReplaySession?.clearAuthorityPresentations?.({commit:false});return true}",
            "function currentAnalysisRunId(){return W.ReplaySession?.snapshot?.()?.analysisRun?.runId||window.__wbReplaySessionV1?.analysisRun?.runId||null}\nfunction holdKindOf(row={}){if(row?.holdKind)return text(row.holdKind);const codes=Array.isArray(row?.detail?.reasonCodes)?row.detail.reasonCodes.filter(Boolean):[],status=text(row?.detail?.generationStatus);if(row?.reason==='NO_SEQUENCE_CANDIDATES'&&status==='UNRESOLVED'&&codes.length)return'SEMANTIC_HOLD';if(row?.reason==='DECISION_AUTHORITY_CAPTURE_MISSING'||row?.reason==='PREACTION_ANCHOR_AMBIGUOUS')return'AUTHORITY_HOLD';return'SYSTEM_ERROR'}\nfunction holdHeadlineForRow(row={}){const codes=Array.isArray(row?.detail?.reasonCodes)?row.detail.reasonCodes.filter(Boolean):[],kind=holdKindOf(row);if(codes.includes('OPPONENT_WARD_UNRESOLVED'))return'相手の守護が未確認のため、比較を保留しています。';if(kind==='AUTHORITY_HOLD')return'判断に必要な局面情報を確定できないため、比較を保留しています。';return'比較に必要な情報が未確認のため、比較を保留しています。'}\nfunction recordSystemHold(row,runId,windowId){const key=[runId,windowId,row?.reason,row?.at].map(text).join('|');if(systemHoldKeys.has(key))return false;systemHoldKeys.add(key);const err=new Error(`比較処理を継続できません: ${row?.reason||'SYSTEM_ERROR'}`);W.recordError?.('pf1-system-hold',err,{windowId,runId,holdKind:holdKindOf(row),reason:row?.reason||null,generationStatus:row?.detail?.generationStatus||null,reasonCodes:clone(row?.detail?.reasonCodes||[]),stage:row?.detail?.stage||null});return true}\nasync function ingestDecision(detail={}){const d=normalizeDetail(detail),activeRunId=currentAnalysisRunId();if(!d.windowId||!d.decision||!d.runId||!activeRunId||String(d.runId)!==String(activeRunId)||!authorityPresentationForWindow(d.windowId,d.runId))return null;const authority=await loadAuthority(),explanation=authority.explainDecision(d.decision,{playedMove:d.playedMove}),holdHeadline=d.decision?.meta?.holdHeadline||null;if(holdHeadline&&d.decision?.meta?.holdKind!=='SYSTEM_ERROR')explanation.headline=holdHeadline;const row={version:VERSION,windowId:d.windowId,runId:d.runId,sourceAuthority:d.sourceAuthority,receivedAt:d.receivedAt,playedMove:clone(d.playedMove),holdKind:d.decision?.meta?.holdKind||null,decisionIdentity:{status:d.decision.status||null,classification:d.decision.classification||null,bestCandidateId:d.decision.bestCandidateId||null,meaningfulAlternativeCandidateId:d.decision.meaningfulAlternativeCandidateId||null},explanation:clone(explanation)};items.set(d.windowId,row);expose();scheduleDecorate();return clone(row)}\nfunction safeHoldDecision(row={}){const kind=holdKindOf(row),reasonCodes=Array.isArray(row?.detail?.reasonCodes)?row.detail.reasonCodes:[],reasons=[...new Set(['INSUFFICIENT_AUTHORITY',...reasonCodes,row?.reason].filter(Boolean))],holdHeadline=holdHeadlineForRow(row);return{status:'HOLD',classification:'INSUFFICIENT_EVIDENCE',bestCandidateId:null,meaningfulAlternativeCandidateId:null,reasonCodes:reasons,criticalDifference:null,ranking:{pairwise:[]},meta:{sourceStatus:row?.status||'HOLD',sourceReason:row?.reason||null,generationStatus:row?.detail?.generationStatus||null,holdKind:kind,holdHeadline,sourceReasonCodes:clone(reasonCodes)}}}\nasync function syncFromRuntime(runId=null){const snap=W.RuntimeDecisionPipeline?.snapshot?.()||window.__wbRuntimeDecisionPipelineV1||null,rows=Array.isArray(snap?.items)?snap.items:[];let ingested=0,skipped=0,systemErrors=0;for(const row of rows){const rowRunId=row?.meta?.runId||row?.runId||null,windowId=text(row?.windowId);if(!windowId||!rowRunId){skipped++;continue}if(runId&&String(rowRunId)!==String(runId)){skipped++;continue}if(!authorityPresentationForWindow(windowId,rowRunId)){skipped++;continue}const current=items.get(windowId);if(current&&String(current.runId||'')===String(rowRunId)){skipped++;continue}let decision=null,sourceAuthority=row.sourceAuthority||'P-F1/P-D1/P-F1-R2-PM',playedMove=row.playedMove||row?.meta?.playedMove||null;if(row?.status==='OK'&&row?.decision)decision=row.decision;else if(row?.status==='HOLD'){const kind=holdKindOf(row);if(kind==='SYSTEM_ERROR'){items.delete(windowId);if(recordSystemHold(row,rowRunId,windowId))systemErrors++;skipped++;continue}decision=safeHoldDecision(row);sourceAuthority=`P-F1 ${kind}`;playedMove=null}else{skipped++;continue}const accepted=await ingestDecision({windowId,decision,playedMove,sourceAuthority,receivedAt:row.at||new Date().toISOString(),runId:rowRunId});if(accepted)ingested++;else skipped++}return{version:PRESENTATION_VERSION,runId:runId||null,examined:rows.length,ingested,skipped,systemErrors}}\nfunction clear(){items.clear();systemHoldKeys.clear();expose();W.ReplaySession?.clearAuthorityPresentations?.({commit:false});return true}")
          replace_once(p,
            "W.CoachIntegration=Object.freeze({version:VERSION,presentationVersion:PRESENTATION_VERSION,eventName:EVENT,loadAuthority,loadRuntimePipeline,normalizeDetail,ingestDecision,safeHoldDecision,syncFromRuntime,getForWindow,presentationModel,authorityPresentationForWindow,applyAuthorityPresentation,decorateAuthorityBindings,suppressLegacyCoach,createCard,decorate,snapshot,clear});",
            "W.CoachIntegration=Object.freeze({version:VERSION,presentationVersion:PRESENTATION_VERSION,eventName:EVENT,loadAuthority,loadRuntimePipeline,normalizeDetail,ingestDecision,holdKindOf,holdHeadlineForRow,safeHoldDecision,syncFromRuntime,getForWindow,presentationModel,authorityPresentationForWindow,applyAuthorityPresentation,decorateAuthorityBindings,suppressLegacyCoach,createCard,decorate,snapshot,clear});")

          # Diagnostics: export the complete P-F1 HOLD chain, plus a compact directly auditable form.
          p='diagnostics.js'
          replace_once(p,"const VERSION='diagnostics-clean-1.58';","const VERSION='diagnostics-clean-1.59';")
          replace_once(p,"function diagnostic(){", "function holdDiagnostics(){const snap=WB.RuntimeDecisionPipeline?.snapshot?.()||window.__wbRuntimeDecisionPipelineV1||null,rows=Array.isArray(snap?.items)?snap.items:[];return{version:'pf1-hold-diagnostics-v1',pipelineVersion:snap?.version||null,items:rows.filter(x=>x?.status==='HOLD'||x?.status==='ERROR').map(x=>({windowId:x?.windowId||null,runId:x?.meta?.runId||x?.runId||null,status:x?.status||null,reason:x?.reason||null,holdKind:x?.holdKind||null,stage:x?.detail?.stage||null,generationStatus:x?.detail?.generationStatus||null,reasonCodes:clone(x?.detail?.reasonCodes||[]),message:x?.detail?.message||null,at:x?.at||null}))}}\nfunction diagnostic(){")
          replace_once(p,
            "pf1r2InputTraceV1:clone(WB.RuntimeAuthorityBinding?.snapshot?.()?.inputTrace||window.__wbPF1R2InputTraceV1||null),reviewCoachV1:",
            "pf1r2InputTraceV1:clone(WB.RuntimeAuthorityBinding?.snapshot?.()?.inputTrace||window.__wbPF1R2InputTraceV1||null),runtimeDecisionPipelineV1:clone(WB.RuntimeDecisionPipeline?.snapshot?.()||window.__wbRuntimeDecisionPipelineV1||null),holdDiagnosticsV1:holdDiagnostics(),comparisonCoachV1:clone(WB.CoachIntegration?.snapshot?.()||window.__wbComparisonCoachV1||null),reviewCoachV1:")

          # Keep expected-module integrity aligned with diagnostics version.
          replace_once('app-core.js',"'diagnostics':'diagnostics-clean-1.58'","'diagnostics':'diagnostics-clean-1.59'")

          # Existing version assertions follow the production module versions.
          for path in Path('tests').glob('*'):
              if not path.is_file() or path.suffix not in {'.mjs','.cjs','.js'}: continue
              s=path.read_text()
              s=s.replace('pf1-runtime-decision-pipeline-v1.2.1','pf1-runtime-decision-pipeline-v1.2.2')
              s=s.replace('pe2-coach-integration-v1.2.1','pe2-coach-integration-v1.2.2')
              s=s.replace('diagnostics-clean-1.58','diagnostics-clean-1.59')
              path.write_text(s)

          # Real iPhone fixture now expects the explicit Ward hold and the new hold kind.
          fixture_path=Path('tests/pf1r2-0923-integrated-acceptance-fixture.json')
          fixture=json.loads(fixture_path.read_text())
          fixture['expected']['holdKind']='SEMANTIC_HOLD'
          fixture['expected']['coachHeadline']='相手の守護が未確認のため、比較を保留しています。'
          fixture_path.write_text(json.dumps(fixture,ensure_ascii=False,separators=(',',':'))+'\n')

          p='tests/pf1r2-0923-integrated-acceptance-regression.cjs'
          s=Path(p).read_text()
          anchor="  check(pipeRow?.detail?.generationStatus===fixture.expected.generationStatus&&holdReasons.includes(fixture.expected.safeHoldCriticalReason),'IPHONE_RAW_TRACE_INNER_HOLD_REASON_WARD_UNRESOLVED',`generation=${pipeRow?.detail?.generationStatus}; reasons=${holdReasons.join(',')}`);"
          if anchor not in s: raise SystemExit('integrated hold anchor missing')
          s=s.replace(anchor,anchor+"\n  check(pipeRow?.holdKind===fixture.expected.holdKind,'IPHONE_RAW_TRACE_HOLD_KIND_SEMANTIC',`holdKind=${pipeRow?.holdKind}`);",1)
          s=s.replace("'IPHONE_RAW_TRACE_COACH_DISPLAY_MATCHES_DEVICE'","'IPHONE_RAW_TRACE_COACH_EXPLAINS_WARD_UNRESOLVED'",1)
          Path(p).write_text(s)

          # Dedicated classification + coach/system-error + diagnostics contract regression.
          Path('tests/pf1r2-hold-diagnostics-regression.mjs').write_text(r'''import fs from 'node:fs';
import vm from 'node:vm';
import assert from 'node:assert/strict';
const read=name=>fs.readFileSync(new URL('../'+name,import.meta.url),'utf8');
const pipelineSrc=read('runtime-decision-pipeline.js');
const coachSrc=read('coach-integration.js');
const diagnosticsSrc=read('diagnostics.js');

const WB={optionalModules:[],emit(){},on(){},onReady(){},log(){},recordError(){}};
const window={WB};window.window=window;
vm.runInNewContext(pipelineSrc,{window,console,setTimeout,clearTimeout,Promise,Date,Error,JSON,Object,Array,Map,Set,String,Number,Math});
const P=WB.RuntimeDecisionPipeline;
assert.equal(P.version,'pf1-runtime-decision-pipeline-v1.2.2');
assert.equal(P.classifyHold(P.HOLD.NO_SEQUENCE_CANDIDATES,{stage:'P-A1',generationStatus:'UNRESOLVED',reasonCodes:['OPPONENT_WARD_UNRESOLVED']}),P.HOLD_KIND.SEMANTIC_HOLD);
assert.equal(P.classifyHold(P.HOLD.DECISION_AUTHORITY_CAPTURE_MISSING,{}),P.HOLD_KIND.AUTHORITY_HOLD);
assert.equal(P.classifyHold(P.HOLD.MODULE_UNAVAILABLE,{}),P.HOLD_KIND.SYSTEM_ERROR);
assert.equal(P.classifyHold(P.HOLD.NO_SEQUENCE_CANDIDATES,{stage:'P-C1',outcomeCount:0}),P.HOLD_KIND.SYSTEM_ERROR);

const recordedErrors=[];
const runId='run-A',windowId='window-A';
const WB2={optionalModules:[],on(){},onReady(){},log(){},emit(){},recordError(scope,err,data){recordedErrors.push({scope,message:err?.message||String(err),...data})},ReplaySession:{snapshot:()=>({analysisRun:{runId}}),clearAuthorityPresentations(){}},RuntimeAuthorityBinding:{presentationForWindow:(id,r)=>id===windowId&&r===runId?{windowId:id,runId:r}:null},RuntimeDecisionPipeline:{snapshot:()=>({items:[]})}};
const window2={WB:WB2};window2.window=window2;
vm.runInNewContext(coachSrc,{window:window2,console,setTimeout,clearTimeout,queueMicrotask,Promise,Date,Error,JSON,Object,Array,Map,Set,String,Number,Math});
const C=WB2.CoachIntegration;
assert.equal(C.version,'pe2-coach-integration-v1.2.2');
const semanticRow={status:'HOLD',holdKind:'SEMANTIC_HOLD',reason:'NO_SEQUENCE_CANDIDATES',detail:{stage:'P-A1',generationStatus:'UNRESOLVED',reasonCodes:['OPPONENT_WARD_UNRESOLVED']},meta:{runId}};
const safe=C.safeHoldDecision(semanticRow);
assert.equal(safe.meta.holdKind,'SEMANTIC_HOLD');
assert.equal(safe.meta.holdHeadline,'相手の守護が未確認のため、比較を保留しています。');
assert.ok(safe.reasonCodes.includes('OPPONENT_WARD_UNRESOLVED'));
const systemRow={status:'HOLD',holdKind:'SYSTEM_ERROR',windowId,reason:'MODULE_UNAVAILABLE',detail:{message:'missing'},meta:{runId},at:'2026-10-11T00:00:00.000Z'};
WB2.RuntimeDecisionPipeline.snapshot=()=>({items:[systemRow]});
const synced=await C.syncFromRuntime(runId);
assert.equal(synced.ingested,0);
assert.equal(synced.systemErrors,1);
assert.equal(C.snapshot().count,0);
assert.equal(recordedErrors.at(-1)?.scope,'pf1-system-hold');
assert.equal(recordedErrors.at(-1)?.holdKind,'SYSTEM_ERROR');

for(const token of ['runtimeDecisionPipelineV1','holdDiagnosticsV1','comparisonCoachV1','generationStatus','reasonCodes','holdKind'])assert.ok(diagnosticsSrc.includes(token),`diagnostics must export ${token}`);
console.log('P-F1-R2 HOLD DIAGNOSTICS REGRESSION PASS');
''')

          # Gate: make the new contract permanent and update the raw-trace comment.
          gate=Path('tests/run-quality-gate.mjs'); gs=gate.read_text()
          gs=gs.replace("recognition-quality-gate-v112","recognition-quality-gate-v113",1)
          gs=gs.replace("// Its 09-23 capture fixture remains explicitly APPROXIMATION until the first iPhone raw exact trace replaces the approximated 113.638 evidence.","// The 09-23 integrated fixture is now sourced from the iPhone exact raw trace subset; HOLD diagnostics must preserve outer reason, hold kind, generation status and inner reason codes.",1)
          marker="  'tests/pf1r2-0923-integrated-acceptance-regression.cjs',"
          if marker not in gs: raise SystemExit('gate insertion anchor missing')
          gs=gs.replace(marker,marker+"\n  'tests/pf1r2-hold-diagnostics-regression.mjs',",1)
          gate.write_text(gs)

          # Rebuild the exact 20-asset manifest after production JS changes.
          index_path=Path('index.html'); index=index_path.read_text()
          m=re.search(r'const manifest=window\.__wbRuntimeAssetManifest=(\{.*?\});',index,re.S)
          if not m: raise SystemExit('runtime manifest missing')
          manifest=json.loads(m.group(1))
          integrity={}
          for name in manifest['assets']:
              digest=base64.b64encode(hashlib.sha256(Path(name).read_bytes()).digest()).decode()
              integrity[name]='sha256-'+digest
          manifest['integrity']=integrity
          canonical='\n'.join(f"{name}:{integrity[name]}" for name in manifest['assets'])
          new_id='candidate-assets-'+hashlib.sha256(canonical.encode()).hexdigest()[:12]
          old_id=manifest['buildId']; manifest['buildId']=new_id
          manifest_json=json.dumps(manifest,separators=(',',':'),ensure_ascii=False)
          index=index[:m.start(1)]+manifest_json+index[m.end(1):]
          index=index.replace(old_id,new_id)
          index_path.write_text(index)
          latest_path=Path('latest.json'); latest=json.loads(latest_path.read_text()); latest['runtimeBuildId']=new_id; latest['runtimeAssetCount']=len(manifest['assets']); latest_path.write_text(json.dumps(latest,ensure_ascii=False,indent=2)+'\n')
          print('RUNTIME_BUILD_ID='+new_id)

          # Remove this one-shot workflow from the final candidate tree.
          Path('.github/workflows/pf1r2-hold-diagnostics-patch.yml').unlink()
          PY
      - name: Commit corrective
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: distinguish semantic holds from runtime faults'
          git push origin HEAD:candidate/p-f1-r2-hold-diagnostics
