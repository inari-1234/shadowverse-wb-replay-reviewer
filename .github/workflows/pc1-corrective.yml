name: P-C1 Unknown Classification Corrective

on:
  push:
    branches:
      - candidate/ui-opt6p-pc1-outcome-backtracking
    paths:
      - '.pc1-corrective/READY'

permissions:
  contents: write

jobs:
  corrective:
    if: github.event.head_commit.message == 'P-C1 corrective ready'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Preserve exact unknown semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('outcome-backtracking.js')
          s=p.read_text()
          replacements={
          "const rs=unknownReasons(g);return rs.some(r=>String(r).includes('UNKNOWN_CARD'))?DRAW_STATUS.UNKNOWN_DRAW:DRAW_STATUS.NO_DRAW_EVIDENCE;":"const rs=unknownReasons(g);return rs.some(r=>String(r).includes('UNKNOWN_CARD')||String(r).includes('UNKNOWN_DRAW'))?DRAW_STATUS.UNKNOWN_DRAW:DRAW_STATUS.NO_DRAW_EVIDENCE;",
          "let nodes=0,duplicates=0,cycles=0,memoHits=0,unknownCount=0,truncated=false;const reasons=[];":"let nodes=0,duplicates=0,cycles=0,memoHits=0,unknownCount=0,truncated=false;const reasons=[],unknownReasonCodes=[];",
          "const ur=unknownReasons(g);unknownCount+=ur.length;if(g.status!=='OK')":"const ur=unknownReasons(g);unknownCount+=ur.length;unknownReasonCodes.push(...ur);if(g.status!=='OK')",
          "return {lines,nodes,duplicates,cycles,memoHits,unknownCount,truncated,reasonCodes:uniq(reasons)};":"return {lines,nodes,duplicates,cycles,memoHits,unknownCount,unknownReasonCodes:uniq(unknownReasonCodes),truncated,reasonCodes:uniq(reasons)};",
          "function responseType(line,hasUnknown){const real=(line.actions||[]).filter(a=>a.actionType!=='END_TURN');if(hasUnknown&&real.length===0)return RESPONSE_TYPE.UNKNOWN_HAND_DEPENDENT_RESPONSE;if(real.length===0)return RESPONSE_TYPE.NO_KNOWN_RESPONSE;return RESPONSE_TYPE.OBSERVED_AVAILABLE_RESPONSE;}":"function responseType(line,unknownRs){const real=(line.actions||[]).filter(a=>a.actionType!=='END_TURN');if(real.length===0&&isHiddenUnknown(unknownRs||[]))return RESPONSE_TYPE.UNKNOWN_HAND_DEPENDENT_RESPONSE;if(real.length===0)return RESPONSE_TYPE.NO_KNOWN_RESPONSE;return RESPONSE_TYPE.OBSERVED_AVAILABLE_RESPONSE;}",
          "const rt=responseType(line,oppSearch.unknownCount>0),rid=":"const rt=responseType(line,oppSearch.unknownReasonCodes||[]),rid=",
          "if(oppSearch.unknownCount>0)fr.push(REASON.OPPONENT_RESPONSE_UNKNOWN_HAND);":"if(isHiddenUnknown(oppSearch.unknownReasonCodes||[]))fr.push(REASON.OPPONENT_RESPONSE_UNKNOWN_HAND);",
          "unknownBranches:oppSearch.unknownCount,truncated:":"unknownBranches:oppSearch.unknownCount,unknownReasonCodes:clone(oppSearch.unknownReasonCodes||[]),truncated:",
          "...fr,...oppSearch.reasonCodes]),reasonCodes:":"...fr,...oppSearch.reasonCodes,...(oppSearch.unknownReasonCodes||[])]),reasonCodes:"
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit('source corrective anchor missing: '+old[:80])
              s=s.replace(old,new,1)
          p.write_text(s)

          q=Path('tests/pc1-outcome-backtracking-regression.mjs')
          t=q.read_text()
          old="const {out}=evalOne({S0,S1,O0,M0},edges);assert.ok(out.uncertainty.includes(REASON.OPPONENT_RESPONSE_UNKNOWN_HAND));assert.notEqual(out.lethalStatus,LETHAL_STATUS.NEXT_TURN_LETHAL_FORCED);"
          if old not in t:
              raise SystemExit('OC-18 anchor missing')
          t=t.replace(old,old+"assert.ok(out.opponentResponses.some(r=>r.responseType===RESPONSE_TYPE.UNKNOWN_HAND_DEPENDENT_RESPONSE));",1)
          anchor="// OC-20 indeterminate rule ordering safely stops."
          extra="// Extra: unknown effect is preserved as a rule uncertainty, not mislabeled as unknown hand.\n{\n const S0=node('S0'),S1=node('S1'),O0=node('O0',{activePlayer:'P2',unknownReasons:['UNKNOWN_EFFECT_RULE']}),M0=node('M0',{activePlayer:'P1'});\n const edges=[{from:'S0',to:'S1',id:'PLAY'},{from:'S1',to:'O0',id:'ET1',type:'END_TURN'},{from:'O0',to:'M0',id:'ET2',type:'END_TURN'}];\n const {out}=evalOne({S0,S1,O0,M0},edges);assert.ok(out.uncertainty.includes(REASON.UNKNOWN_EFFECT_RULE));assert.equal(out.uncertainty.includes(REASON.OPPONENT_RESPONSE_UNKNOWN_HAND),false);\n}\n"
          if anchor not in t:
              raise SystemExit('OC-20 anchor missing')
          t=t.replace(anchor,extra+anchor,1)
          q.write_text(t)
          PY
      - name: Validate corrective change
        run: |
          node --check outcome-backtracking.js
          node tests/pc1-outcome-backtracking-regression.mjs
          node tests/pc1-static-validation.mjs
      - name: Commit corrective implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outcome-backtracking.js tests/pc1-outcome-backtracking-regression.mjs
          git commit -m 'fix: preserve P-C1 unknown reason semantics'
          git push origin HEAD:${GITHUB_REF_NAME}
