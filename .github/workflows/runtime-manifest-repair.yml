name: Runtime Manifest Repair
on:
  push:
    branches:
      - candidate/p-f1-r2-runtime-manifest-corrective
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Rebuild manifest from exact runtime assets and commit
        run: |
          python3 - <<'PY'
          import re, json, base64, hashlib, pathlib, datetime
          p=pathlib.Path('index.html')
          html=p.read_text()
          m=re.search(r'const manifest=window\.__wbRuntimeAssetManifest=(\{.*?\});', html)
          assert m, 'runtime manifest not found'
          manifest=json.loads(m.group(1))
          integrity={}
          for name in manifest['assets']:
              data=pathlib.Path(name).read_bytes()
              integrity[name]='sha256-'+base64.b64encode(hashlib.sha256(data).digest()).decode()
          canonical='\n'.join(f'{name}:{integrity[name]}' for name in manifest['assets'])
          build_id='candidate-assets-'+hashlib.sha256(canonical.encode()).hexdigest()[:12]
          manifest['buildId']=build_id
          manifest['integrity']=integrity
          compact=json.dumps(manifest,separators=(',',':'),ensure_ascii=False)
          html=html[:m.start(1)]+compact+html[m.end(1):]
          p.write_text(html)
          latest_path=pathlib.Path('latest.json')
          latest=json.loads(latest_path.read_text())
          latest['runtimeBuildId']=build_id
          latest['runtimeAssetCount']=len(manifest['assets'])
          latest['updatedAt']='2026-10-11T00:46:00+09:00'
          latest_path.write_text(json.dumps(latest,ensure_ascii=False,indent=2)+'\n')
          print('RUNTIME_BUILD_ID='+build_id)
          print('ASSET_COUNT='+str(len(manifest['assets'])))
          print('COACH_INTEGRATION_SRI='+integrity['coach-integration.js'])
          PY
          rm .github/workflows/runtime-manifest-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html latest.json .github/workflows/runtime-manifest-repair.yml
          git commit -m 'fix: rebuild runtime asset manifest from exact files'
          git push origin HEAD:candidate/p-f1-r2-runtime-manifest-corrective
