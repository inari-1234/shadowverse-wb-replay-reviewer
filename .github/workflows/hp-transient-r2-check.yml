name: HP Transient R2 Check
on:
  push:
    branches:
      - candidate/p-f1-r2-hp-transient-r2
    paths:
      - 'runtime-authority-binding.js'
      - 'tests/pf1r2-hp-transient-guard-regression.mjs'
      - 'tests/pf1r2-hp-transient-live-summary-regression.mjs'
      - '.github/workflows/hp-transient-r2-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Existing and live-summary HP regressions
        run: |
          node tests/pf1r2-hp-transient-guard-regression.mjs
          node tests/pf1r2-hp-transient-live-summary-regression.mjs
