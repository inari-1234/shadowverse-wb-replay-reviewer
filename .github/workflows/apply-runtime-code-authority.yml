name: Apply P-F1-R2 Runtime Code Authority

on:
  push:
    branches:
      - candidate/p-f1-r2-runtime-code-authority

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-code-authority-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: candidate/p-f1-r2-runtime-code-authority
          fetch-depth: 0
      - name: Apply runtime code authority
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json, hashlib, base64

          def read(path): return Path(path).read_text()
          def write(path,s): Path(path).write_text(s)
          def replace_once(path, old, new):
              s=read(path)
              if old not in s:
                  raise SystemExit(f'missing pattern in {path}: {old[:120]}')
              write(path,s.replace(old,new,1))

          # Dynamic loaders: the same helper applies nonce + SRI + build ID metadata.
          replace_once('counterfactual-review.js',
            "s.src=window.__wbAssetUrl?window.__wbAssetUrl('./coach-integration.js'):'./coach-integration.js';",
            "if(window.__wbPrepareAssetScript)window.__wbPrepareAssetScript(s,'./coach-integration.js');else s.src=window.__wbAssetUrl?window.__wbAssetUrl('./coach-integration.js'):'./coach-integration.js';")
          replace_once('coach-integration.js',
            "s.src=window.__wbAssetUrl?window.__wbAssetUrl('./coach-explanation.js'):'./coach-explanation.js';",
            "if(window.__wbPrepareAssetScript)window.__wbPrepareAssetScript(s,'./coach-explanation.js');else s.src=window.__wbAssetUrl?window.__wbAssetUrl('./coach-explanation.js'):'./coach-explanation.js';")
          replace_once('coach-integration.js',
            "s.src=window.__wbAssetUrl?window.__wbAssetUrl('./runtime-decision-pipeline.js'):'./runtime-decision-pipeline.js';",
            "if(window.__wbPrepareAssetScript)window.__wbPrepareAssetScript(s,'./runtime-decision-pipeline.js');else s.src=window.__wbAssetUrl?window.__wbAssetUrl('./runtime-decision-pipeline.js'):'./runtime-decision-pipeline.js';")
          replace_once('runtime-decision-pipeline.js',
            "s.src=window.__wbAssetUrl?window.__wbAssetUrl(src):src;",
            "if(window.__wbPrepareAssetScript)window.__wbPrepareAssetScript(s,src);else s.src=window.__wbAssetUrl?window.__wbAssetUrl(src):src;")
          replace_once('runtime-decision-pipeline.js',
            "s.src=window.__wbAssetUrl?window.__wbAssetUrl('./runtime-authority-binding.js'):'./runtime-authority-binding.js';",
            "if(window.__wbPrepareAssetScript)window.__wbPrepareAssetScript(s,'./runtime-authority-binding.js');else s.src=window.__wbAssetUrl?window.__wbAssetUrl('./runtime-authority-binding.js'):'./runtime-authority-binding.js';")
          replace_once('runtime-authority-binding.js',
            "s.src=window.__wbAssetUrl?window.__wbAssetUrl(src):src;",
            "if(window.__wbPrepareAssetScript)window.__wbPrepareAssetScript(s,src);else s.src=window.__wbAssetUrl?window.__wbAssetUrl(src):src;")

          # App-core: retain legacy module-version contract, add independent runtime content authority.
          app=read('app-core.js')
          old="const WB=window.WB={APP,runtimeChannel:RUNTIME_CHANNEL,uiView:'review',expectedModules:EXPECTED_MODULE_VERSIONS,modules:[],moduleRegistrations:[],moduleRegistrationDuplicates:[],events:[],errors:[],readyQueue:[],ready:false,video:null,videoMeta:null,videoName:'replay',objectUrl:null,turnTimeline:[],turnValidation:null,mulligan:null,classDetection:null,stateCapture:null,matchAnalysisLast:null,scenes:[],seekCount:0,seekReasons:{},task:null,cancelRequested:false,swInfo:null};"
          new="const WB=window.WB={APP,runtimeChannel:RUNTIME_CHANNEL,uiView:'review',expectedModules:EXPECTED_MODULE_VERSIONS,modules:[],moduleRegistrations:[],moduleBuildRegistrations:[],moduleRegistrationDuplicates:[],runtimeBuildAuthority:null,events:[],errors:[],readyQueue:[],ready:false,video:null,videoMeta:null,videoName:'replay',objectUrl:null,turnTimeline:[],turnValidation:null,mulligan:null,classDetection:null,stateCapture:null,matchAnalysisLast:null,scenes:[],seekCount:0,seekReasons:{},task:null,cancelRequested:false,swInfo:null};"
          if old not in app: raise SystemExit('app WB init missing')
          app=app.replace(old,new,1)
          old="WB.registerModule=(name,version)=>{const row={name:String(name??''),version:String(version??'')};WB.moduleRegistrations.push({...row});const existing=WB.modules.find(x=>x.name===row.name);if(existing){WB.moduleRegistrationDuplicates.push({name:row.name,firstVersion:existing.version,duplicateVersion:row.version});return existing}WB.modules.push(row);return row};"
          new="WB.registerModule=(name,version)=>{const row={name:String(name??''),version:String(version??'')},buildId=document.currentScript?.dataset?.wbBuildId||window.__wbRuntimeAssetManifest?.buildId||null;WB.moduleRegistrations.push({...row});WB.moduleBuildRegistrations.push({...row,buildId});const existing=WB.modules.find(x=>x.name===row.name);if(existing){WB.moduleRegistrationDuplicates.push({name:row.name,firstVersion:existing.version,duplicateVersion:row.version});return existing}WB.modules.push(row);return row};"
          if old not in app: raise SystemExit('registerModule missing')
          app=app.replace(old,new,1)
          old="WB.onReady=fn=>{if(WB.ready)Promise.resolve().then(fn);else WB.readyQueue.push(fn)};"
          new="""WB.onReady=fn=>{if(WB.ready)Promise.resolve().then(fn);else WB.readyQueue.push(fn)};
WB.ensureRuntimeBuildAuthority=async()=>{if(WB.runtimeChannel!=='candidate')return{ok:true,version:'runtime-code-authority-v1',mode:'main-not-enforced',buildId:APP.build,total:0,verified:0,rows:[]};let authority;try{authority=await window.__wbRuntimeBuildAuthorityPromise}catch(err){authority={ok:false,version:'runtime-code-authority-v1',buildId:window.__wbRuntimeAssetManifest?.buildId||null,total:Number(window.__wbRuntimeAssetManifest?.assets?.length||0),verified:0,rows:[],error:err?.message||String(err)}}WB.runtimeBuildAuthority=authority||window.__wbRuntimeBuildAuthority||null;if(WB.runtimeBuildAuthority?.ok!==true){const err=new Error('実行コードの整合性を確認できないため解析を停止しました。更新後に再実行してください。');err.code='RUNTIME_BUILD_AUTHORITY_INVALID';WB.recordError('runtime-build-authority',err,{authority:WB.runtimeBuildAuthority});throw err}return WB.runtimeBuildAuthority};"""
          if old not in app: raise SystemExit('onReady missing')
          app=app.replace(old,new,1)
          old="WB.runTask=async(name,fn,{lockText='動画位置を自動操作しています。'}={})=>{if(WB.task)throw new Error(`別処理を実行中です: ${WB.task}`);"
          new="WB.runTask=async(name,fn,{lockText='動画位置を自動操作しています。'}={})=>{if(WB.runtimeChannel==='candidate')await WB.ensureRuntimeBuildAuthority();if(WB.task)throw new Error(`別処理を実行中です: ${WB.task}`);"
          if old not in app: raise SystemExit('runTask missing')
          app=app.replace(old,new,1)
          old="const latest=await WB.fetchCandidateLatest(),status=WB.$('#candidateChannelStatus');if(status){const latestBuild=latest?.build||null;status.textContent=latestBuild&&latestBuild!==APP.build?'更新あり':(latestBuild?'最新版':'更新確認失敗')};WB.log('candidate-channel-ready',{build:APP.build,latestBuild:latest?.build||null})"
          new="const latest=await WB.fetchCandidateLatest(),status=WB.$('#candidateChannelStatus');let runtimeAuthority=null;try{runtimeAuthority=await WB.ensureRuntimeBuildAuthority()}catch(_err){}if(status){const latestBuild=latest?.build||null;if(runtimeAuthority?.ok===true)status.textContent=`candidate ${runtimeAuthority.buildId} / ${runtimeAuthority.verified}/${runtimeAuthority.total}一致${latestBuild&&latestBuild!==APP.build?' / 更新あり':''}`;else{status.textContent=`コード不一致 ${runtimeAuthority?.verified||0}/${runtimeAuthority?.total||window.__wbRuntimeAssetManifest?.assets?.length||0} — 解析停止`;status.style.color='#fca5a5'}};WB.log('candidate-channel-ready',{build:APP.build,latestBuild:latest?.build||null,runtimeBuildAuthority:runtimeAuthority})"
          if old not in app: raise SystemExit('candidate status block missing')
          app=app.replace(old,new,1)
          write('app-core.js',app)

          # Diagnostics: expose direct runtime content authority and module build IDs.
          d=read('diagnostics.js')
          old="moduleRegistrations:clone(WB.moduleRegistrations||[]),modules:clone(WB.modules),runtimeInvariant:inv"
          new="moduleRegistrations:clone(WB.moduleRegistrations||[]),moduleBuildRegistrations:clone(WB.moduleBuildRegistrations||[]),runtimeBuildAuthority:clone(WB.runtimeBuildAuthority||window.__wbRuntimeBuildAuthority||null),modules:clone(WB.modules),runtimeInvariant:inv"
          if old not in d: raise SystemExit('diagnostic registration block missing')
          d=d.replace(old,new,1)
          write('diagnostics.js',d)

          # Fresh evidence: candidate chain cannot be CHAIN_OK unless exact runtime code authority is green.
          b=read('runtime-authority-binding.js')
          old="const session=window.__wbReplaySessionV1||W.ReplaySession?.snapshot?.()||null,windows=Array.isArray(session?.decisionWindows)?session.decisionWindows:[],rows=Array.isArray(evaluation?.results)?evaluation.results:[],runId=summary?.runId||null,nonce=summary?.nonce||null;"
          new="const session=window.__wbReplaySessionV1||W.ReplaySession?.snapshot?.()||null,windows=Array.isArray(session?.decisionWindows)?session.decisionWindows:[],rows=Array.isArray(evaluation?.results)?evaluation.results:[],runId=summary?.runId||null,nonce=summary?.nonce||null,assetAuthority=clone(W.runtimeBuildAuthority||window.__wbRuntimeBuildAuthority||null),assetAuthorityRequired=W.runtimeChannel==='candidate',assetAuthorityOk=!assetAuthorityRequired||(assetAuthority?.ok===true&&Number(assetAuthority?.verified||0)===Number(assetAuthority?.total||-1)&&Number(assetAuthority?.total||0)>0&&typeof assetAuthority?.buildId==='string'&&!!assetAuthority.buildId);"
          if old not in b: raise SystemExit('fresh evidence header missing')
          b=b.replace(old,new,1)
          old="if(summary?.status==='FAILED'||summary?.status==='UNAVAILABLE')status='CAPTURE_FAILED';else if(runId&&nonce&&chainSuccessWindowIds.length)status='CHAIN_OK';"
          new="if(!assetAuthorityOk)status='RUNTIME_BUILD_AUTHORITY_INVALID';else if(summary?.status==='FAILED'||summary?.status==='UNAVAILABLE')status='CAPTURE_FAILED';else if(runId&&nonce&&chainSuccessWindowIds.length)status='CHAIN_OK';"
          if old not in b: raise SystemExit('fresh status block missing')
          b=b.replace(old,new,1)
          old="return{version:EVIDENCE_VERSION,gateVersion:FRESH_GATE_VERSION,freshRun:true,runId,nonce,status,generatedAt:new Date().toISOString(),"
          new="return{version:EVIDENCE_VERSION,gateVersion:FRESH_GATE_VERSION,freshRun:true,runId,nonce,status,assetAuthority,generatedAt:new Date().toISOString(),"
          if old not in b: raise SystemExit('fresh return missing')
          b=b.replace(old,new,1)
          write('runtime-authority-binding.js',b)

          # CLI verifier: code delivery and analysis correctness are independent mandatory authorities.
          v=read('tests/pf1r2-fresh-diagnostic-verifier.mjs')
          needle="if(evidence.version!=='pf1r2-fresh-real-video-evidence-v1.1.0'||evidence.gateVersion!=='pf1r2-g-fresh-e2e-gate-v1.0.0')fail('FRESH_EVIDENCE_VERSION_INVALID',{version:evidence.version,gateVersion:evidence.gateVersion});\n"
          insert="const assetAuthority=evidence?.assetAuthority||diagnostic?.runtimeBuildAuthority||null;\nif(!assetAuthority||assetAuthority.ok!==true||typeof assetAuthority.buildId!=='string'||!assetAuthority.buildId||Number(assetAuthority.total||0)<1||Number(assetAuthority.verified||0)!==Number(assetAuthority.total))fail('RUNTIME_BUILD_AUTHORITY_INVALID',{assetAuthority});\n"
          if needle not in v: raise SystemExit('fresh verifier insertion missing')
          v=v.replace(needle,needle+insert,1)
          write('tests/pf1r2-fresh-diagnostic-verifier.mjs',v)

          # Candidate SW: candidate HTML/JS/latest are network-only; never silently substitute cached code.
          sw=read('sw.js')
          old="self.addEventListener('fetch',event=>{const req=event.request,url=new URL(req.url);if(url.origin!==location.origin){event.respondWith(fetch(req));return}if(url.pathname.endsWith('/latest.json'))"
          new="self.addEventListener('fetch',event=>{const req=event.request,url=new URL(req.url);if(url.origin!==location.origin){event.respondWith(fetch(req));return}const candidateRequest=url.searchParams.has('_wb')||url.searchParams.get('channel')==='candidate',candidateAssetRequest=candidateRequest&&url.pathname.endsWith('.js'),candidateProtectedRequest=candidateAssetRequest||(candidateRequest&&(req.mode==='navigate'||url.pathname.endsWith('/index.html')||url.pathname.endsWith('/latest.json')));if(candidateProtectedRequest){event.respondWith(fetch(req,{cache:'no-store'}).catch(()=>Response.error()));return}if(url.pathname.endsWith('/latest.json'))"
          if old not in sw: raise SystemExit('sw fetch header missing')
          sw=sw.replace(old,new,1)
          write('sw.js',sw)

          # 09-23 learning oracle: preserve Quick-only as a real P-A1 branch; fix expected semantics.
          fpath=Path('tests/pf1r2-0923-offline-expected-fixture.json')
          fixture=json.loads(fpath.read_text())
          fixture['expected']['quickOnlyCandidateGenerated']=True
          fixture['expected']['coachTradeOffHeadline']='候補ごとに異なる長所があるため、推奨手を1つに絞れません。'
          fixture['expected']['playedMoveLabel']='刹那のクイックブレイダー＋進化'
          fpath.write_text(json.dumps(fixture,ensure_ascii=False,indent=2)+'\n')

          o=read('tests/pf1r2-0923-offline-expected-regression.mjs')
          old="await check('0923-04','production P-A1 exposes legal normal evolution for played Quick',()=>{assert.ok(afterPlay,'post-play state prerequisite missing');const g=actionEngine.generateLegalActions(afterPlay);evolve=g.actions.find(a=>a.actionType==='EVOLVE'&&a.source?.cardId==='quickBlader');assert.ok(evolve,'Quick EVOLVE action missing');const r=actionEngine.applyAction(afterPlay,evolve);"
          new="await check('0923-04','production P-A1 exposes legal normal evolution and Quick-only branch for played Quick',()=>{assert.ok(afterPlay,'post-play state prerequisite missing');const g=actionEngine.generateLegalActions(afterPlay);evolve=g.actions.find(a=>a.actionType==='EVOLVE'&&a.source?.cardId==='quickBlader');assert.ok(evolve,'Quick EVOLVE action missing');const generated=actionEngine.generateSequences(source,{maxDepth:3,maxNodes:120,maxSequences:80});const quickOnly=generated.sequences.find(x=>x.actions?.length===2&&x.actions[0]?.actionType==='PLAY_CARD'&&x.actions[0]?.source?.cardId==='quickBlader'&&x.actions[1]?.actionType==='END_TURN');assert.ok(quickOnly,'Quick-only P-A1 candidate missing');assert.equal(fixture.expected.quickOnlyCandidateGenerated,true);const r=actionEngine.applyAction(afterPlay,evolve);"
          if old not in o: raise SystemExit('offline 0923-04 block missing')
          o=o.replace(old,new,1)
          old="decision=D.evaluateDecision([quickOutcome,idleOutcome]);assert.equal(decision.status,'OK');assert.equal(decision.ranking.pairwise.length,1);assert.ok(['DOMINATES','TRADE_OFF','EQUIVALENT','CONTEXT_DEPENDENT','INSUFFICIENT_EVIDENCE'].includes(decision.classification))"
          new="decision=D.evaluateDecision([quickOutcome,idleOutcome]);assert.equal(decision.status,'OK');assert.equal(decision.ranking.pairwise.length,1);assert.equal(decision.classification,fixture.expected.visibleTradeOff.classification)"
          if old not in o: raise SystemExit('offline decision block missing')
          o=o.replace(old,new,1)
          old="assert.ok(coach.playedMoveComparison);if(decision.bestCandidateId)assert.match(s,/刹那のクイックブレイダー/)"
          new="assert.ok(coach.playedMoveComparison);assert.equal(coach.headline,fixture.expected.coachTradeOffHeadline);assert.equal(fixture.expected.playedMoveLabel,'刹那のクイックブレイダー＋進化');if(decision.bestCandidateId)assert.match(s,/刹那のクイックブレイダー/)"
          if old not in o: raise SystemExit('offline coach block missing')
          o=o.replace(old,new,1)
          write('tests/pf1r2-0923-offline-expected-regression.mjs',o)

          # Build exact runtime manifest after all code changes. The shared build ID is content-addressed.
          assets=[
            'app-core.js','turn-recognition.js','mulligan-class.js','card-db.js','hand-recognition.js','state-recognition.js','replay-session.js','review-engine.js','counterfactual-review.js','diagnostics.js',
            'coach-integration.js','coach-explanation.js','runtime-decision-pipeline.js','runtime-authority-binding.js','legal-action-sequence.js','outcome-backtracking.js','comparison-decision.js','played-move-authority.js','position-state-runtime.js','common-rule-engine-runtime.js'
          ]
          integrity={}
          raw_digests={}
          for p in assets:
              data=Path(p).read_bytes(); dig=hashlib.sha256(data).digest(); raw_digests[p]=dig.hex(); integrity[p]='sha256-'+base64.b64encode(dig).decode()
          build_seed='\n'.join(f'{p}:{raw_digests[p]}' for p in sorted(assets)).encode()
          build_id='candidate-assets-'+hashlib.sha256(build_seed).hexdigest()[:12]

          index=read('index.html')
          pattern=re.compile(r'<script>\n\(\(\)=>\{\n  const localScripts=\[[\s\S]*?\n\}\)\(\);\n</script>',re.M)
          m=pattern.search(index)
          if not m: raise SystemExit('index candidate bootstrap missing')
          manifest_json=json.dumps({'version':'runtime-code-authority-v1','buildId':build_id,'assets':assets,'integrity':integrity},separators=(',',':'))
          bootstrap=f'''<script>\n(()=>{{\n  const localScripts=['app-core.js','turn-recognition.js','mulligan-class.js','card-db.js','hand-recognition.js','state-recognition.js','replay-session.js','review-engine.js','counterfactual-review.js','diagnostics.js'];\n  const pageUrl=new URL(location.href),candidate=pageUrl.pathname.includes('/candidate-live/')||pageUrl.searchParams.get('channel')==='candidate',nonce=candidate?(pageUrl.searchParams.get('_wb')||String(Date.now())):'';\n  const manifest=window.__wbRuntimeAssetManifest={manifest_json};\n  window.__wbCandidateAssetNonce=nonce||null;\n  window.__wbAssetUrl=src=>{{if(!candidate)return src;const u=new URL(src,location.href);u.searchParams.set('_wb',nonce);return u.href}};\n  const assetName=src=>new URL(src,location.href).pathname.split('/').pop();\n  window.__wbPrepareAssetScript=(script,src)=>{{const name=assetName(src),expected=manifest.integrity[name];script.src=window.__wbAssetUrl(src);if(expected){{script.integrity=expected;script.crossOrigin='anonymous';script.dataset.wbBuildId=manifest.buildId;script.dataset.wbAsset=name}}return script}};\n  const b64=bytes=>{{let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode(...bytes.subarray(i,Math.min(bytes.length,i+0x8000)));return btoa(s)}};\n  const verify=async name=>{{const expected=manifest.integrity[name],url=window.__wbAssetUrl('./'+name);try{{const res=await fetch(url,{{cache:'no-store'}});if(!res.ok)throw new Error('HTTP '+res.status);if(!globalThis.crypto?.subtle)throw new Error('WebCrypto unavailable');const digest=new Uint8Array(await crypto.subtle.digest('SHA-256',await res.arrayBuffer())),actual='sha256-'+b64(digest);return{{name,ok:actual===expected,expected,actual,url}}}}catch(err){{return{{name,ok:false,expected,actual:null,url,error:err?.message||String(err)}}}}}};\n  window.__wbRuntimeBuildAuthorityPromise=candidate?Promise.all(manifest.assets.map(verify)).then(rows=>{{const value={{version:manifest.version,buildId:manifest.buildId,total:rows.length,verified:rows.filter(x=>x.ok).length,ok:rows.length>0&&rows.every(x=>x.ok),rows,checkedAt:new Date().toISOString()}};window.__wbRuntimeBuildAuthority=value;return value}}):Promise.resolve({{version:manifest.version,buildId:manifest.buildId,total:0,verified:0,ok:true,mode:'main-not-enforced',rows:[]}});\n  for(const src of localScripts){{const expected=manifest.integrity[src],url=window.__wbAssetUrl('./'+src);document.write('<script defer data-wb-build-id="'+manifest.buildId+'" data-wb-asset="'+src+'" integrity="'+expected+'" crossorigin="anonymous" src="'+url+'"><\\/script>')}}\n}})();\n</script>'''
          index=index[:m.start()]+bootstrap+index[m.end():]
          write('index.html',index)

          # The runtime-code-authority regression expects the literal token "integrity:" for manifest semantics.
          # JSON is quoted, so make the check representation-agnostic without weakening requirements.
          t=read('tests/pf1r2-runtime-code-authority-regression.mjs').replace("assert.match(index,/integrity:\\s*\\{/,'runtime asset manifest must carry exact per-file integrity digests');","assert.ok(index.includes('\\\"integrity\\\":{'),'runtime asset manifest must carry exact per-file integrity digests');")
          write('tests/pf1r2-runtime-code-authority-regression.mjs',t)

          # Keep latest metadata inspectable without pretending a self-referential commit SHA can be embedded.
          lp=Path('latest.json'); latest=json.loads(lp.read_text()); latest['runtimeBuildId']=build_id; latest['runtimeAssetCount']=len(assets); lp.write_text(json.dumps(latest,ensure_ascii=False,indent=2)+'\n')
          print('runtime build',build_id,'assets',len(assets))
          PY
      - name: Static diff check and regression
        run: |
          git diff --check
          node tests/pf1r2-runtime-code-authority-regression.mjs
          node tests/pf1r2-learning-candidate-oracle-regression.mjs
      - name: Commit corrective
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-core.js index.html latest.json sw.js diagnostics.js counterfactual-review.js coach-integration.js runtime-decision-pipeline.js runtime-authority-binding.js tests/pf1r2-fresh-diagnostic-verifier.mjs tests/pf1r2-0923-offline-expected-fixture.json tests/pf1r2-0923-offline-expected-regression.mjs tests/pf1r2-runtime-code-authority-regression.mjs
          git diff --cached --check
          git commit -m "[runtime-code-authority-applied] P-F1-R2 bind candidate code delivery to exact assets"
          git push origin HEAD:candidate/p-f1-r2-runtime-code-authority
