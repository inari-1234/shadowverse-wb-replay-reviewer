name: Apply Runtime Invariant Cache Contract

on:
  push:
    branches:
      - candidate/p-f1-r2-candidate-cache

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-invariant-cache-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: candidate/p-f1-r2-candidate-cache
          fetch-depth: 0
      - name: Update runtime invariant
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/runtime-invariants.mjs')
          s=p.read_text()
          old="""const runtime=[...index.matchAll(/<script[^>]+src=\"\\.\\/([^\"]+\\.js)\"/g)].map(m=>m[1]);\nassert.deepEqual(runtime,expectedRuntime,'index runtime must remain exactly the approved ten scripts in order');\nassert.equal(runtime.some(x=>/fix-v/i.test(x)),false,'historical fix-v scripts must never load at runtime');"""
          new="""const staticRuntime=[...index.matchAll(/<script[^>]+src=\"\\.\\/([^\"]+\\.js)\"/g)].map(m=>m[1]);\nconst bootstrapBlock=index.match(/const localScripts=\\[([^\\]]+)\\]/);\nconst bootstrapRuntime=bootstrapBlock?[...bootstrapBlock[1].matchAll(/'([^']+\\.js)'/g)].map(m=>m[1]):[];\nassert.ok(staticRuntime.length===0||bootstrapRuntime.length===0,'runtime scripts must use exactly one loading representation');\nconst runtime=staticRuntime.length?staticRuntime:bootstrapRuntime;\nassert.deepEqual(runtime,expectedRuntime,'index runtime must remain exactly the approved ten scripts in order, whether static or candidate nonce-bootstrap form');\nif(bootstrapRuntime.length){\n  assert.ok(index.includes('window.__wbAssetUrl=src=>'),'nonce-bootstrap runtime must route local script URLs through the candidate asset helper');\n  assert.ok(index.includes("u.searchParams.set('_wb',nonce)"),'candidate asset helper must add only the refresh nonce query parameter');\n}\nassert.equal(runtime.some(x=>/fix-v/i.test(x)),false,'historical fix-v scripts must never load at runtime');"""
          if old not in s:
              raise SystemExit('runtime invariant target block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit invariant update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/runtime-invariants.mjs
          git diff --cached --check
          git commit -m "[runtime-invariant-cache-applied] test approved runtime scripts in nonce bootstrap"
          git push origin HEAD:candidate/p-f1-r2-candidate-cache
