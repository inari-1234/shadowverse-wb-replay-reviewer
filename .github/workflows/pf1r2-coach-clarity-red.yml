name: P-F1-R2 Coach Clarity RED

on:
  workflow_dispatch:
  push:
    branches:
      - 'candidate/p-f1-r2-coach-clarity'
    paths:
      - 'tests/pf1r2-coach-clarity-corrective-regression.mjs'
      - '.github/workflows/pf1r2-coach-clarity-red.yml'

permissions:
  contents: read

jobs:
  corrective-red:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: New semantic contract must fail on the old implementation before corrective
        run: node tests/pf1r2-coach-clarity-corrective-regression.mjs
