name: P-F1-R2 Coach Clarity Apply

on:
  workflow_dispatch:
  push:
    branches:
      - 'candidate/p-f1-r2-coach-clarity'
    paths:
      - 'tools/pf1r2-coach-clarity-patch.mjs'
      - '.github/workflows/pf1r2-coach-clarity-apply.yml'

permissions:
  contents: write

jobs:
  apply-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install pinned integrated-acceptance dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Apply exact corrective patch
        run: node tools/pf1r2-coach-clarity-patch.mjs
      - name: New semantic contract GREEN
        run: node tests/pf1r2-coach-clarity-corrective-regression.mjs
      - name: Runtime code authority self-check
        run: node tests/pf1r2-runtime-code-authority-regression.mjs
      - name: Full Quality Gate
        run: node tests/run-quality-gate.mjs
      - name: Commit corrective product and regression changes
        shell: bash
        run: |
          git config user.name 'inari-1234'
          git config user.email 'shouri95@yahoo.co.jp'
          git add app-core.js coach-explanation.js runtime-authority-binding.js replay-session.js index.html latest.json tests
          if git diff --cached --quiet; then
            echo 'No corrective changes to commit'
            exit 0
          fi
          git commit -m 'fix: clarify confirmed tradeoff coach and EP provenance'
          git push origin HEAD:candidate/p-f1-r2-coach-clarity
