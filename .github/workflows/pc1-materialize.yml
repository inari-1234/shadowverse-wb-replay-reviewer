name: P-C1 Materialize

on:
  push:
    branches:
      - candidate/ui-opt6p-pc1-outcome-backtracking
    paths:
      - '.pc1-transfer/READY'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message == 'P-C1 transfer ready'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Materialize P-C1 sources
        shell: bash
        run: |
          cat .pc1-transfer/outcome.*.part > outcome-backtracking.js
          cat .pc1-transfer/regression.*.part > tests/pc1-outcome-backtracking-regression.mjs
          cat .pc1-transfer/static.*.part > tests/pc1-static-validation.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/run-quality-gate.mjs')
          s=p.read_text()
          s=s.replace("recognition-quality-gate-v83", "recognition-quality-gate-v84")
          s=s.replace("// ui-opt6P P-A1 legal action / sequence generator + existing recognition/replay regression", "// ui-opt6P P-C1 outcome backtracking + P-A1 + existing recognition/replay regression")
          anchor="  'tests/pa1-legal-action-sequence-regression.mjs',"
          insert=anchor+"\n  'tests/pc1-outcome-backtracking-regression.mjs',\n  'tests/pc1-static-validation.mjs',"
          if "pc1-outcome-backtracking-regression.mjs" not in s:
              if anchor not in s:
                  raise SystemExit('P-A1 quality-gate anchor missing')
              s=s.replace(anchor,insert)
          p.write_text(s)
          PY
      - name: Validate P-C1 before commit
        run: |
          node --check outcome-backtracking.js
          node tests/pc1-outcome-backtracking-regression.mjs
          node tests/pc1-static-validation.mjs
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outcome-backtracking.js tests/pc1-outcome-backtracking-regression.mjs tests/pc1-static-validation.mjs tests/run-quality-gate.mjs
          git commit -m 'ui-opt6P P-C1 outcome backtracking implementation'
          git push origin HEAD:${GITHUB_REF_NAME}
