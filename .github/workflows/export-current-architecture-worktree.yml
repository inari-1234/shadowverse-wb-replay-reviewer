name: Export Current Architecture Worktree
on:
  push:
    branches:
      - candidate/p-f1-r2-architecture-corrective
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Archive current exact worktree
        run: |
          tar --exclude=.git --exclude=.github/workflows/export-current-architecture-worktree.yml -czf "$RUNNER_TEMP/current-architecture-worktree.tgz" .
      - uses: actions/upload-artifact@v4
        with:
          name: current-architecture-worktree
          path: ${{ runner.temp }}/current-architecture-worktree.tgz
          if-no-files-found: error
