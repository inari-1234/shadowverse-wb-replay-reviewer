name: Finalize HP Transient R2
on:
  push:
    branches:
      - candidate/p-f1-r2-hp-transient-r2
    paths:
      - '.github/scripts/finalize_hp_transient_r2.py'
      - '.github/workflows/finalize-hp-transient-r2.yml'
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[hp-transient-r2-finalized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: candidate/p-f1-r2-hp-transient-r2
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply R2 and finalize Runtime Authority
        run: python .github/scripts/finalize_hp_transient_r2.py
      - name: Dedicated HP safety regression
        run: |
          git diff --check
          node tests/pf1r2-hp-transient-guard-regression.mjs
          node tests/pf1r2-hp-transient-live-summary-regression.mjs
          node tests/replay-session-regression.mjs
          node tests/pf1r2-live-capture-pipeline-regression.mjs
          node tests/pf1r2-runtime-code-authority-regression.mjs
      - name: Full Quality Gate v110
        run: node tests/run-quality-gate.mjs
      - name: Commit finalized candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "[hp-transient-r2-finalized] guard same-turn A-B-A beyond compact summary"
          git push origin HEAD:candidate/p-f1-r2-hp-transient-r2
