name: P-F1-R2 Coach Clarity Inspect

on:
  workflow_dispatch:
  push:
    branches:
      - 'candidate/p-f1-r2-coach-clarity'
    paths:
      - '.github/workflows/pf1r2-coach-clarity-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Show review-card and runtime manifest hooks
        shell: bash
        run: |
          echo '--- replay presentation hooks ---'
          grep -n -E 'reviewStateRows|reviewFlag|beforeRows|afterRows|authorityPresentations|presentationForWindow' replay-session.js
          echo '--- runtime presentation hooks ---'
          grep -n -E 'presentationForWindow|preActionResourceAuthorities' runtime-authority-binding.js | tail -30
          echo '--- runtime manifest ---'
          grep -n -E '__wbRuntimeAssetManifest|candidate-assets-|runtimeAsset|sha256-' index.html | tail -80
          echo '--- latest.json ---'
          cat latest.json
