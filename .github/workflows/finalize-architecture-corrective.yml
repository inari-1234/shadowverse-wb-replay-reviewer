name: Inspect P-F1-R2 Architecture Acceptance
on:
  push:
    branches:
      - candidate/p-f1-r2-architecture-corrective
    paths:
      - '.github/workflows/finalize-architecture-corrective.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: candidate/p-f1-r2-architecture-corrective
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Reconstruct and verify exact finalized patch
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/pf1r2-final-patch/chunk_00.b64 \
              .tmp/pf1r2-final-patch/chunk_01.b64 \
              .tmp/pf1r2-final-patch/chunk_02.b64 \
              .tmp/pf1r2-final-patch/chunk_03.b64 \
              .tmp/pf1r2-final-patch/chunk_04.b64 \
              .tmp/pf1r2-final-patch/chunk_05.b64 > /tmp/final.patch.gz.b64
          test "$(wc -c < /tmp/final.patch.gz.b64)" -eq 39464
          echo '7e8ed4365fda7a0b515ae7eb9fb3d7ea758fafbd8fdeb2901fc8afdd74a5c62d  /tmp/final.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/final.patch.gz.b64 > /tmp/final.patch.gz
          echo '64effcfadb9768e9f947a30bb85fbd37ee89463178489408687c5a0f23752f20  /tmp/final.patch.gz' | sha256sum -c -
          gzip -dc /tmp/final.patch.gz > /tmp/final.patch
          echo 'bcbc3e929d30a0723ef28d1b21a590556a8f95b51dcb065e7d1b15fa86572844  /tmp/final.patch' | sha256sum -c -
          echo '=== FINAL PATCH TARGETS ==='
          git apply --numstat /tmp/final.patch
      - name: Materialize proposed green tree without committing
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/pf1r2-green HEAD
          cp /tmp/final.patch /tmp/pf1r2-green/final.patch
          cd /tmp/pf1r2-green
          git apply --check final.patch
          git apply final.patch
          rm final.patch
          echo '=== PROPOSED CHANGES VS candidate-live ==='
          git diff --name-status candidate-live
          git status --short
          echo '=== ACCEPTANCE FILE CANDIDATES ==='
          find tests -maxdepth 3 -type f \( -iname '*0923*' -o -iname '*09-23*' -o -iname '*acceptance*' \) -print | sort
          test -f tests/pf1r2-0923-recorded-acceptance-regression.mjs
          echo '=== ACCEPTANCE TEST SHA256 ==='
          sha256sum tests/pf1r2-0923-recorded-acceptance-regression.mjs
          echo '=== ACCEPTANCE TEST REFERENCES ==='
          grep -nE 'fixture|json|09-23|0923|115\.888|113\.638|18|15' tests/pf1r2-0923-recorded-acceptance-regression.mjs || true
      - name: Run exact acceptance against candidate-live and classify RED
        shell: bash
        run: |
          set -euo pipefail
          green=/tmp/pf1r2-green
          git worktree add --detach /tmp/pf1r2-red candidate-live
          red=/tmp/pf1r2-red
          testfile=tests/pf1r2-0923-recorded-acceptance-regression.mjs
          mkdir -p "$red/tests"
          cp "$green/$testfile" "$red/$testfile"
          # Copy only fixture files referenced by the acceptance when they exist in the proposed tree.
          python - <<'PY'
          from pathlib import Path
          import re, shutil
          green=Path('/tmp/pf1r2-green')
          red=Path('/tmp/pf1r2-red')
          test=green/'tests/pf1r2-0923-recorded-acceptance-regression.mjs'
          text=test.read_text()
          refs=set(re.findall(r"['\"]([^'\"]+\.(?:json|txt|csv))['\"]", text))
          copied=[]
          for ref in sorted(refs):
              src=(test.parent/ref).resolve() if ref.startswith('.') else (green/ref)
              try: src.relative_to(green)
              except ValueError: continue
              if src.is_file():
                  dst=red/src.relative_to(green)
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(src,dst)
                  copied.append(str(src.relative_to(green)))
          print('COPIED_FIXTURES', *copied)
          if not copied:
              print('NO_EXTERNAL_FIXTURE_REFERENCES')
          PY
          echo '=== FROZEN ACCEPTANCE HASHES GREEN SOURCE ==='
          sha256sum "$green/$testfile"
          find "$green/tests" -maxdepth 3 -type f \( -iname '*0923*' -o -iname '*09-23*' \) ! -path "$green/$testfile" -print0 | sort -z | xargs -0 -r sha256sum
          echo '=== SAME HASHES IN RED WORKTREE ==='
          sha256sum "$red/$testfile"
          find "$red/tests" -maxdepth 3 -type f \( -iname '*0923*' -o -iname '*09-23*' \) ! -path "$red/$testfile" -print0 | sort -z | xargs -0 -r sha256sum
          set +e
          (cd "$red" && node "$testfile") > /tmp/accept-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/accept-red.log
          echo "RED_EXIT_CODE=$rc"
          test "$rc" -ne 0
          if grep -Eiq 'ReferenceError|SyntaxError|TypeError: .* is not a function|ERR_MODULE_NOT_FOUND|Cannot find module' /tmp/accept-red.log; then
            echo 'RED_REASON_INVALID_API_OR_LOAD_FAILURE=1'
            exit 21
          fi
          if grep -Eiq '18[^0-9]+15|115\.888|stale|past run|previous run|run.*mix|mixed.*run|過去run|混在' /tmp/accept-red.log; then
            echo 'RED_REASON_SYMPTOM_ASSERT=1'
          else
            echo 'RED_REASON_SYMPTOM_ASSERT=0'
            exit 22
          fi
      - name: Stop after inspection
        run: |
          echo 'INSPECTION_ONLY_COMPLETE=1'
          exit 23
