name: Apply Candidate Cache Corrective

on:
  push:
    branches:
      - candidate/p-f1-r2-candidate-cache

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[cache-corrective-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: candidate/p-f1-r2-candidate-cache
          fetch-depth: 0
      - name: Apply cache corrective
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path)
              s=p.read_text()
              if old not in s:
                  raise SystemExit(f'missing expected pattern in {path}: {old[:80]}')
              p.write_text(s.replace(old,new,1))

          index=Path('index.html')
          s=index.read_text()
          old='''<script defer src="./app-core.js"></script>\n<script defer src="./turn-recognition.js"></script>\n<script defer src="./mulligan-class.js"></script>\n<script defer src="./card-db.js"></script>\n<script defer src="./hand-recognition.js"></script>\n<script defer src="./state-recognition.js"></script>\n<script defer src="./replay-session.js"></script>\n<script defer src="./review-engine.js"></script>\n<script defer src="./counterfactual-review.js"></script>\n<script defer src="./diagnostics.js"></script>'''
          new='''<script>\n(()=>{\n  const localScripts=['app-core.js','turn-recognition.js','mulligan-class.js','card-db.js','hand-recognition.js','state-recognition.js','replay-session.js','review-engine.js','counterfactual-review.js','diagnostics.js'];\n  const pageUrl=new URL(location.href),candidate=pageUrl.pathname.includes('/candidate-live/')||pageUrl.searchParams.get('channel')==='candidate',nonce=candidate?(pageUrl.searchParams.get('_wb')||String(Date.now())):'';\n  window.__wbCandidateAssetNonce=nonce||null;\n  window.__wbAssetUrl=src=>{if(!candidate)return src;const u=new URL(src,location.href);u.searchParams.set('_wb',nonce);return u.href};\n  for(const src of localScripts)document.write('<script defer src="'+window.__wbAssetUrl('./'+src)+'"><\\/script>');\n})();\n</script>'''
          if old not in s:
              raise SystemExit('index local script block not found')
          index.write_text(s.replace(old,new,1))

          replace('counterfactual-review.js',"s.src='./coach-integration.js';","s.src=window.__wbAssetUrl?window.__wbAssetUrl('./coach-integration.js'):'./coach-integration.js';")
          replace('coach-integration.js',"s.src='./coach-explanation.js';","s.src=window.__wbAssetUrl?window.__wbAssetUrl('./coach-explanation.js'):'./coach-explanation.js';")
          replace('coach-integration.js',"s.src='./runtime-decision-pipeline.js';","s.src=window.__wbAssetUrl?window.__wbAssetUrl('./runtime-decision-pipeline.js'):'./runtime-decision-pipeline.js';")
          replace('runtime-decision-pipeline.js','s.src=src;','s.src=window.__wbAssetUrl?window.__wbAssetUrl(src):src;')
          replace('runtime-decision-pipeline.js',"s.src='./runtime-authority-binding.js';","s.src=window.__wbAssetUrl?window.__wbAssetUrl('./runtime-authority-binding.js'):'./runtime-authority-binding.js';")
          replace('runtime-authority-binding.js','s.src=src;','s.src=window.__wbAssetUrl?window.__wbAssetUrl(src):src;')

          gate=Path('tests/run-quality-gate.mjs')
          g=gate.read_text()
          needle="  'tests/candidate-update-channel-regression.mjs',\n"
          if "tests/candidate-asset-cache-regression.mjs" not in g:
              if needle not in g: raise SystemExit('quality gate insertion point missing')
              g=g.replace(needle,needle+"  'tests/candidate-asset-cache-regression.mjs',\n",1)
              g=g.replace("const GATE_VERSION='recognition-quality-gate-v103';","const GATE_VERSION='recognition-quality-gate-v104';",1)
              gate.write_text(g)
          PY
      - name: Commit corrective
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html counterfactual-review.js coach-integration.js runtime-decision-pipeline.js runtime-authority-binding.js tests/run-quality-gate.mjs
          git diff --cached --check
          git commit -m "[cache-corrective-applied] P-F1-R2 propagate candidate asset nonce"
          git push origin HEAD:candidate/p-f1-r2-candidate-cache
