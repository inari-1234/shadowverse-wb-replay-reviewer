name: iOS Simulator Seek Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'candidate/**'
    paths:
      - 'app-core.js'
      - 'turn-recognition.js'
      - 'tests/ios-simulator/**'
      - '.github/workflows/ios-simulator-seek.yml'

concurrency:
  group: ios-simulator-seek-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-webkit-seek:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Show Xcode and Simulator inventory
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: Download deterministic video fixture
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4 \
            -o tests/ios-simulator/fixture.mp4
          ls -lh tests/ios-simulator/fixture.mp4

      - name: Boot available iPhone Simulator
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          UDID="$(python3 - <<'PY'
          import json, subprocess
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          candidates=[]
          for runtime,devices in data.get('devices',{}).items():
              if 'iOS' not in runtime: continue
              for d in devices:
                  if d.get('isAvailable') and str(d.get('name','')).startswith('iPhone'):
                      candidates.append((runtime,d['name'],d['udid']))
          if not candidates:
              raise SystemExit('No available iPhone Simulator device')
          preferred=['iPhone 16 Pro','iPhone 17 Pro','iPhone 16','iPhone 17']
          candidates.sort(key=lambda x:x[0],reverse=True)
          latest_runtime=candidates[0][0]
          same_runtime=[x for x in candidates if x[0]==latest_runtime]
          for name in preferred:
              match=next((x for x in same_runtime if x[1]==name),None)
              if match:
                  print(match[2]);break
          else:
              print(same_runtime[0][2])
          PY
          )"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Run benchmark in iOS Simulator Safari
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$RUNNER_TEMP/ios-seek-result.json"
          python3 tests/ios-simulator/serve_benchmark.py --root "$GITHUB_WORKSPACE" --port 8765 --output "$RESULT" > "$RUNNER_TEMP/seek-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8765/tests/ios-simulator/seek-benchmark.html >/dev/null && break
            sleep 1
          done
          xcrun simctl openurl "${{ steps.sim.outputs.udid }}" "http://127.0.0.1:8765/tests/ios-simulator/seek-benchmark.html?video=/tests/ios-simulator/fixture.mp4"
          for i in {1..90}; do
            if [ -s "$RESULT" ]; then break; fi
            sleep 1
          done
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot "$RUNNER_TEMP/ios-seek-benchmark.png" || true
          cat "$RUNNER_TEMP/seek-server.log" || true
          test -s "$RESULT"
          cat "$RESULT"
          node tests/ios-simulator/validate-result.mjs "$RESULT"

      - name: Upload simulator benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-seek-benchmark
          path: |
            ${{ runner.temp }}/ios-seek-result.json
            ${{ runner.temp }}/ios-seek-benchmark.png
            ${{ runner.temp }}/seek-server.log
          if-no-files-found: warn
