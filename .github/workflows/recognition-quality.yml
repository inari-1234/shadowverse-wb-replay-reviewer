name: Recognition Quality Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '*.js'
      - 'index.html'
      - 'latest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'experiments/**'
      - 'tests/**'
      - 'tools/one-shot-human-review-corrective.mjs'
      - 'tools/one-shot-human-review-corrective-postfix.mjs'
      - '.github/workflows/recognition-quality.yml'
  push:
    branches:
      - main
      - 'candidate/**'
    paths:
      - '*.js'
      - 'index.html'
      - 'latest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'experiments/**'
      - 'tests/**'
      - 'tools/one-shot-human-review-corrective.mjs'
      - 'tools/one-shot-human-review-corrective-postfix.mjs'
      - '.github/workflows/recognition-quality.yml'

concurrency:
  group: recognition-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply one-shot Human Review corrective
        run: |
          node tools/one-shot-human-review-corrective.mjs
          node tools/one-shot-human-review-corrective-postfix.mjs
      - name: Install pinned integrated-acceptance dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Run corrective quality gate
        run: node tests/run-quality-gate.mjs
      - name: Commit generated corrective tree
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-core.js coach-explanation.js coach-integration.js runtime-authority-binding.js diagnostics.js index.html latest.json tests
          git diff --cached --quiet && exit 0
          git commit -m "fix: expose confirmed tradeoff played move"
          git push origin HEAD:${GITHUB_REF_NAME}
