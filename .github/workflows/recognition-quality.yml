name: Recognition Quality Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '*.js'
      - 'index.html'
      - 'latest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'experiments/**'
      - 'tests/**'
      - '.github/workflows/recognition-quality.yml'
  push:
    branches:
      - main
      - 'candidate/**'
    paths:
      - '*.js'
      - 'index.html'
      - 'latest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'experiments/**'
      - 'tests/**'
      - '.github/workflows/recognition-quality.yml'

concurrency:
  group: recognition-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install pinned integrated-acceptance dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Run regression and real-device benchmark gate
        run: node tests/run-quality-gate.mjs
