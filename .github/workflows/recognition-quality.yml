name: Recognition Quality Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '*.js'
      - 'index.html'
      - 'latest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'experiments/**'
      - 'tests/**'
      - '.github/workflows/recognition-quality.yml'
  push:
    branches:
      - main
      - 'candidate/**'
    paths:
      - '*.js'
      - 'index.html'
      - 'latest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'experiments/**'
      - 'tests/**'
      - '.github/workflows/recognition-quality.yml'

concurrency:
  group: recognition-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply one-shot hold diagnostics patch
        id: patch
        run: |
          python tools/pf1r2_hold_diagnostics_patch.py
          if ! git diff --quiet --exit-code; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git diff --cached --check
            git commit -m 'fix: distinguish semantic holds from runtime faults'
            git push origin HEAD:candidate/p-f1-r2-hold-diagnostics
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install pinned integrated-acceptance dependencies
        if: steps.patch.outputs.changed != 'true'
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Run regression and real-device benchmark gate
        if: steps.patch.outputs.changed != 'true'
        run: node tests/run-quality-gate.mjs
