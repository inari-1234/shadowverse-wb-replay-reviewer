name: Recognition Quality Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '*.js'
      - 'index.html'
      - 'latest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'experiments/**'
      - 'tests/**'
      - '.github/workflows/recognition-quality.yml'
  push:
    branches:
      - main
      - 'candidate/**'
    paths:
      - '*.js'
      - 'index.html'
      - 'latest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'experiments/**'
      - 'tests/**'
      - 'tools/pf1r2_preaction_resource_patch.py'
      - '.github/workflows/recognition-quality.yml'

concurrency:
  group: recognition-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply preaction resource corrective once
        run: |
          if grep -q "pf1r2-preaction-resource-authority-v1.0.0" runtime-authority-binding.js; then
            echo 'already applied'
          else
            python - <<'PY'
          from pathlib import Path
          p=Path('tools/pf1r2_preaction_resource_patch.py')
          s=p.read_text(encoding='utf-8')
          line1='replace_once(Path(\'runtime-authority-binding.js\'),"preActionAnchorVersion:PREACTION_ANCHOR_VERSION,freshGateVersion:FRESH_GATE_VERSION,providerId:PROVIDER_ID","preActionAnchorVersion:PREACTION_ANCHOR_VERSION,resourceCarryVersion:RESOURCE_CARRY_VERSION,freshGateVersion:FRESH_GATE_VERSION,providerId:PROVIDER_ID")'
          line2='replace_once(Path(\'runtime-authority-binding.js\'),"preActionAnchorVersion:PREACTION_ANCHOR_VERSION,freshGateVersion:FRESH_GATE_VERSION,providerId:PROVIDER_ID,ready,indexCapture","preActionAnchorVersion:PREACTION_ANCHOR_VERSION,resourceCarryVersion:RESOURCE_CARRY_VERSION,freshGateVersion:FRESH_GATE_VERSION,providerId:PROVIDER_ID,ready,indexCapture")'
          replacement="""p=Path('runtime-authority-binding.js');s=p.read_text(encoding='utf-8');old=\"preActionAnchorVersion:PREACTION_ANCHOR_VERSION,freshGateVersion:FRESH_GATE_VERSION,providerId:PROVIDER_ID\";new=\"preActionAnchorVersion:PREACTION_ANCHOR_VERSION,resourceCarryVersion:RESOURCE_CARRY_VERSION,freshGateVersion:FRESH_GATE_VERSION,providerId:PROVIDER_ID\";n=s.count(old);\nif n!=2: raise SystemExit(f'runtime-authority-binding.js: expected 2 version export matches, got {n}')\np.write_text(s.replace(old,new),encoding='utf-8')"""
          if s.count(line1)!=1 or s.count(line2)!=1:
              raise SystemExit('patcher cardinality repair markers changed')
          p.write_text(s.replace(line1,replacement,1).replace(line2,'',1),encoding='utf-8')
          PY
            python tools/pf1r2_preaction_resource_patch.py
            git checkout -- .github/workflows/recognition-quality.yml tools/pf1r2_preaction_resource_patch.py
            git diff --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add legal-action-sequence.js outcome-backtracking.js runtime-authority-binding.js played-move-authority.js index.html latest.json tests/pa1-legal-action-sequence-regression.mjs tests/pc1-static-validation.mjs tests/pf0a-runtime-authority-binding-regression.mjs tests/pf0a-static-validation.mjs tests/pf1r2-played-move-authority-regression.mjs tests/pf1r2pm-static-validation.mjs tests/pf1r2-preaction-resource-authority-fixture.json tests/pf1r2-preaction-resource-authority-regression.mjs tests/run-quality-gate.mjs
            git commit -m 'fix: preserve preaction resource authority without unknown-to-zero collapse'
            git push origin HEAD:candidate/p-f1-r2-preaction-resource-authority
          fi
      - name: Install pinned integrated-acceptance dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Run regression and real-device benchmark gate
        run: node tests/run-quality-gate.mjs
