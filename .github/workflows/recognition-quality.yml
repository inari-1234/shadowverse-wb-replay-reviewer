name: Recognition Quality Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '*.js'
      - 'index.html'
      - 'latest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'experiments/**'
      - 'tests/**'
      - '.github/workflows/recognition-quality.yml'
  push:
    branches:
      - main
      - 'candidate/**'
    paths:
      - '*.js'
      - 'index.html'
      - 'latest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'experiments/**'
      - 'tests/**'
      - 'tools/pf1r2_pm_match_runid_patch.py'
      - '.github/workflows/recognition-quality.yml'

concurrency:
  group: recognition-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply played-move production runId corrective once
        run: |
          if grep -q "pf1r2-played-move-authority-v1.1.1" played-move-authority.js; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            python tools/pf1r2_pm_match_runid_patch.py
            git checkout -- .github/workflows/recognition-quality.yml tools/pf1r2_pm_match_runid_patch.py
            git diff --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add played-move-authority.js index.html latest.json tests/pf1r2-played-move-authority-regression.mjs tests/pf1r2pm-static-validation.mjs
            git commit -m 'fix: accept production match runId for played-move authority'
            git push origin HEAD:candidate/p-f1-r2-playedmove-match-runid
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install pinned integrated-acceptance dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Run regression and real-device benchmark gate
        run: node tests/run-quality-gate.mjs
