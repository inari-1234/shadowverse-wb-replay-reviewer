name: Apply Authority-only Presentation

on:
  push:
    branches:
      - candidate/p-f1-r2-authority-only-presentation
    paths:
      - '.github/scripts/apply_authority_only_presentation.py'
      - '.github/workflows/apply-authority-only-presentation.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[authority-only-presentation-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: candidate/p-f1-r2-authority-only-presentation
          fetch-depth: 0
      - name: Apply corrective
        run: python .github/scripts/apply_authority_only_presentation.py
      - name: Dedicated regression
        run: |
          git diff --check
          node tests/pf1r2-authority-only-presentation-regression.mjs
          node tests/pf1r2-live-presentation-regression.mjs
          node tests/pf1r2-authority-playback-regression.mjs
      - name: Commit corrective
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coach-integration.js
          git diff --cached --check
          git commit -m "[authority-only-presentation-applied] P-F1-R2 decouple fresh presentation from comparison success"
          git push origin HEAD:candidate/p-f1-r2-authority-only-presentation
