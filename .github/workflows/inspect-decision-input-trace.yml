name: Inspect Decision Input Trace Contract
on:
  push:
    branches:
      - candidate/p-f1-r2-architecture-corrective
    paths:
      - '.github/workflows/inspect-decision-input-trace.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: candidate/p-f1-r2-architecture-corrective
      - name: Reconstruct green and inspect trace contract
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/pf1r2-final-patch/chunk_00.b64 .tmp/pf1r2-final-patch/chunk_01.b64 .tmp/pf1r2-final-patch/chunk_02.b64 .tmp/pf1r2-final-patch/chunk_03.b64 .tmp/pf1r2-final-patch/chunk_04.b64 .tmp/pf1r2-final-patch/chunk_05.b64 > /tmp/final.patch.gz.b64
          base64 -d /tmp/final.patch.gz.b64 | gzip -dc > /tmp/final.patch
          git worktree add --detach /tmp/pf1r2-green HEAD
          (cd /tmp/pf1r2-green && git apply /tmp/final.patch)
          echo '=== PATCH TRACE REFERENCES ==='
          grep -n -E 'decision-input-trace|decisionInput|inputTrace|DecisionInput|traceFor|input trace' /tmp/final.patch || true
          echo '=== GREEN TRACE REFERENCES ==='
          grep -R -n -E 'decisionInput|inputTrace|DecisionInput|traceFor|decision input|input trace' /tmp/pf1r2-green --exclude-dir=.git --exclude='*.b64' | head -300 || true
          echo '=== QUALITY GATE TRACE NEIGHBORHOOD ==='
          grep -n -B4 -A8 'decision-input-trace' /tmp/pf1r2-green/tests/run-quality-gate.mjs || true
          echo '=== RUNTIME PIPELINE PUBLIC API TAIL ==='
          tail -100 /tmp/pf1r2-green/runtime-decision-pipeline.js
          echo '=== REPLAY SESSION PUBLIC API TAIL ==='
          tail -120 /tmp/pf1r2-green/replay-session.js
