name: Validate Decision Input Trace Regression
on:
  push:
    branches:
      - candidate/p-f1-r2-architecture-corrective
    paths:
      - '.github/workflows/inspect-decision-input-trace.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: candidate/p-f1-r2-architecture-corrective
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Reconstruct GREEN and run trace regression
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/pf1r2-final-patch/chunk_00.b64 .tmp/pf1r2-final-patch/chunk_01.b64 .tmp/pf1r2-final-patch/chunk_02.b64 .tmp/pf1r2-final-patch/chunk_03.b64 .tmp/pf1r2-final-patch/chunk_04.b64 .tmp/pf1r2-final-patch/chunk_05.b64 > /tmp/final.patch.gz.b64
          base64 -d /tmp/final.patch.gz.b64 | gzip -dc > /tmp/final.patch
          git worktree add --detach /tmp/pf1r2-green HEAD
          (cd /tmp/pf1r2-green && git apply --check /tmp/final.patch && git apply /tmp/final.patch)
          cd /tmp/pf1r2-green
          node tests/pf1r2-decision-input-trace-regression.mjs
